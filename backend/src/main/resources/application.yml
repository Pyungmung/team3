# [담당: 허겸] 공통 인프라 - 기본(profile-agnostic) 설정
# DB/JWT/Toss 등 민감·환경별 설정은 application-dev.yml / application-prod.yml에서 관리한다.
spring:
  application:
    name: customhouse-backend
  profiles:
    active: dev
  config:
    # CLAUDE.md 수칙: 키는 .env에만 보관. backend/.env(.gitignore 처리됨, .env.example 참고)가 있으면
    # KEY=value 형태를 properties로 읽어와 ${DB_PASSWORD} 등의 플레이스홀더에 자동 주입한다. 파일이 없어도 정상 동작.
    import: optional:file:.env[.properties]

  # [담당: 허겸] 네이버 OAuth2 로그인
  # 실제 client-id/secret은 backend/.env에 설정(네이버 개발자센터에서 앱 등록 후 발급).
  # 값이 없으면 더미 값으로 기동은 되지만, 실제 네이버 로그인은 해당 앱을 등록해야 동작한다.
  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_CLIENT_ID:dummy-naver-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:dummy-naver-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            client-name: Naver
            scope:
              - name
              - email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: 8080

# [담당: 허겸] 이메일 발송 (SendGrid HTTP API) - global/mail/MailClient.java 참고
# 2026-09-30: Gmail SMTP(587/465)가 Render 배포에서 연결 자체가 타임아웃났다(MailConnectException,
# 로컬은 정상 - 클라우드 호스팅이 스팸 방지로 아웃바운드 SMTP를 막는 흔한 정책). SMTP 프로토콜
# 자체를 안 쓰는 HTTP API(포트 443)로 교체했다.
# SENDGRID_FROM_EMAIL은 SendGrid의 "Single Sender Verification"으로 인증한 주소 하나만 쓸 수
# 있다(팀에 소유 도메인이 없어 도메인 전체 인증 대신 이 방식을 씀 - 값이 비어 있으면 기동은 되지만
# 발송 시 MAIL_SEND_FAILED가 난다).
sendgrid:
  api-key: ${SENDGRID_API_KEY:}
  from-email: ${SENDGRID_FROM_EMAIL:}

# [담당: 미정] 고객센터 문의 메일을 받을 관리자 주소
support:
  receiver-email: ${SUPPORT_RECEIVER_EMAIL:rnltjd747@gmail.com}

# [담당: 송귀성] Python AI 엔진(customhouse-ai, FastAPI) 주소
ai-engine:
  base-url: http://localhost:8000

# [담당: 허겸] JWT 설정. JWT_SECRET은 backend/.env에 실제 값 설정 권장(기본값은 로컬 개발용 임시 키).
jwt:
  secret: ${JWT_SECRET:dev-only-temporary-jwt-secret-key-please-change-32bytes-min}
  access-token-expire-ms: 3600000       # 1시간
  refresh-token-expire-ms: 1209600000   # 14일

# [담당: 송귀성] 관리자 계정 (상단 "관리자 수정" 탭). 서버가 켜질 때 이 이메일 계정을 만들거나 관리자로 승격한다.
# 비밀번호는 backend/.env의 ADMIN_PASSWORD에만 둔다 (Git/채팅 금지). 값이 없으면 아무것도 만들지 않는다.
admin:
  email: ${ADMIN_EMAIL:admin@admin.com}
  password: ${ADMIN_PASSWORD:}

# 로그인 성공 후 JWT를 담아 되돌려보낼 프론트엔드 콜백 페이지.
# frontend/serve.py가 frontend/ 전체를 루트로 서빙하므로 실제 파일 경로(frontend/src/pages/...)와
# 맞추려면 /src/가 붙어야 한다. 배포 환경은 OAUTH2_SUCCESS_REDIRECT_URL로 프론트 배포 주소를 넣는다.
oauth2:
  success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:3000/src/pages/auth/oauth-callback.html}

# [담당: 황진구] 토스페이먼츠 연동 (안심 매물 리포트 단건 결제 / 맞집 프리미엄 월 구독)
# 기본값은 토스페이먼츠 공식 샘플(tosspayments/tosspayments-sample)에 공개된 테스트 키입니다.
# 실제 돈이 오가지 않는 샌드박스 키라 누구나 바로 테스트할 수 있고, 실서비스 전환 시에만
# 개발자센터에서 발급받은 라이브 키로 backend/.env에서 교체하면 됩니다.
toss:
  secret-key: ${TOSS_SECRET_KEY:test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R}
  client-key: ${TOSS_CLIENT_KEY:test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq}
