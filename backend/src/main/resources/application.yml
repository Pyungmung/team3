# [담당: 허겸] 공통 인프라 - 기본(profile-agnostic) 설정
# DB/JWT/Toss 등 민감·환경별 설정은 application-dev.yml / application-prod.yml에서 관리한다.
spring:
  application:
    name: customhouse-backend
  profiles:
    active: dev
  config:
    # CLAUDE.md 수칙: 키는 .env에만 보관. backend/.env(.gitignore 처리됨, .env.example 참고)가 있으면
    # KEY=value 형태를 properties로 읽어와 ${DB_PASSWORD} 등의 플레이스홀더에 자동 주입한다. 파일이 없어도 정상 동작.
    import: optional:file:.env[.properties]

  # [담당: 허겸] 네이버 OAuth2 로그인
  # 실제 client-id/secret은 backend/.env에 설정(네이버 개발자센터에서 앱 등록 후 발급).
  # 값이 없으면 더미 값으로 기동은 되지만, 실제 네이버 로그인은 해당 앱을 등록해야 동작한다.
  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_CLIENT_ID:dummy-naver-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:dummy-naver-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            client-name: Naver
            scope:
              - name
              - email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  # [담당: 미정] 고객센터 이메일 문의 발송 (Gmail SMTP)
  # username/password는 backend/.env에서 채운다. 일반 로그인 비밀번호가 아니라 Gmail "앱 비밀번호"를 써야 한다
  # (구글 계정 > 보안 > 2단계 인증 활성화 후 발급). 값이 비어 있으면 기동은 되지만 발송 시 MAIL_SEND_FAILED가 난다.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

# [담당: 미정] 고객센터 문의 메일을 받을 관리자 주소
support:
  receiver-email: ${SUPPORT_RECEIVER_EMAIL:rnltjd747@gmail.com}

# [담당: 송귀성] Python AI 엔진(customhouse-ai, FastAPI) 주소
ai-engine:
  base-url: http://localhost:8000

# [담당: 허겸] JWT 설정. JWT_SECRET은 backend/.env에 실제 값 설정 권장(기본값은 로컬 개발용 임시 키).
jwt:
  secret: ${JWT_SECRET:dev-only-temporary-jwt-secret-key-please-change-32bytes-min}
  access-token-expire-ms: 3600000       # 1시간
  refresh-token-expire-ms: 1209600000   # 14일

# 로그인 성공 후 JWT를 담아 되돌려보낼 프론트엔드 콜백 페이지
oauth2:
  success-redirect-url: http://localhost:3000/pages/auth/oauth-callback.html

# [담당: 황진구] 토스페이먼츠 연동 (안심 매물 리포트 단건 결제 / 맞집 프리미엄 월 구독)
# 기본값은 토스페이먼츠 공식 샘플(tosspayments/tosspayments-sample)에 공개된 테스트 키입니다.
# 실제 돈이 오가지 않는 샌드박스 키라 누구나 바로 테스트할 수 있고, 실서비스 전환 시에만
# 개발자센터에서 발급받은 라이브 키로 backend/.env에서 교체하면 됩니다.
toss:
  secret-key: ${TOSS_SECRET_KEY:test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R}
  client-key: ${TOSS_CLIENT_KEY:test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq}
