# [담당: 김시연] 로컬 MySQL 연동 프로필
# 기본 dev 프로필(H2 인메모리) 대신, 각자 PC에 설치된 실제 MySQL로 붙여서 테스트하고 싶을 때 사용한다.
# 데이터가 서버 재시작해도 유지되고, DB구조도.html이 그리는 실제 테이블/제약조건을 직접 확인할 수 있다.
#
# 사용법
#   1) backend/.env 에 DB_USERNAME / DB_PASSWORD 를 본인 MySQL 계정으로 채운다 (.env.example 참고)
#   2) 아래 두 방법 중 하나로 이 프로필을 "추가"로 활성화해서 실행한다 (dev와 함께 켜야 ai-engine 주소 등
#      나머지 dev 설정도 같이 적용된다):
#        PowerShell:  $env:SPRING_PROFILES_ACTIVE="dev,local-mysql"; .\mvnw.cmd spring-boot:run
#        bash:        SPRING_PROFILES_ACTIVE=dev,local-mysql ./mvnw spring-boot:run
#   3) createDatabaseIfNotExist=true 덕분에 customhouse 데이터베이스가 없으면 자동으로 생성된다.
#      (MySQL 계정에 CREATE DATABASE 권한이 있어야 함 - 보통 root면 충분)
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/customhouse?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # update: 엔티티에 필드를 추가/변경하면 테이블을 알아서 맞춰준다 (컬럼 삭제는 안 함 - 안전).
      # 운영(prod)에서는 validate로 바꿔서 예상치 못한 스키마 변경을 막는다 (application-prod.yml 참고).
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    com.customhouse: DEBUG
