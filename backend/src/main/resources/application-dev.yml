# [담당: 허겸] 로컬 개발 환경 설정
# User 등 도메인 엔티티 저장을 위해 H2 인메모리 DB를 사용한다 (별도 설치 불필요, 서버 재시작 시 초기화됨).
# 운영 전환 시 application-prod.yml의 MySQL 설정으로 교체한다 (테이블 구조는 JPA 엔티티 동일하게 유지).
spring:
  datasource:
    url: jdbc:h2:mem:customhouse;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.customhouse: DEBUG
