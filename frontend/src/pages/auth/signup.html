<!DOCTYPE html>
<!-- [담당: 양혜승] 회원가입 + 로그인 통합 페이지 (연동 대상 백엔드: domain/user, 담당 허겸)
     SafeHouse 프로토타입(indexsignup.html)처럼 한 화면에서 탭으로 회원가입/로그인을 전환한다.
     login.html은 이 페이지의 로그인 탭(#login)으로 보내는 얇은 파일이다 (헤더/마이페이지 등이 login.html을 링크하기 때문).
     프로토타입과 다른 점: 아이디 대신 이메일(로그인 ID)에 중복확인, 이름은 닉네임, 이메일 인증번호는 백엔드 미구현이라 제외. -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맞집 | 회원가입</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      min-height: 100vh;
      background-color: #0f172a;
      background:
        linear-gradient(rgba(15, 23, 42, 0.68), rgba(15, 23, 42, 0.78)),
        url("https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .container {
      width: 100%;
      max-width: 980px;
      min-height: 620px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(255, 255, 255, 0.97);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.30);
    }

    .intro {
      padding: 55px;
      background: linear-gradient(145deg, #0f172a, #1e3a8a);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 18px;
      color: white;
      text-decoration: none;
    }

    .intro h2 { font-size: 31px; line-height: 1.35; margin-bottom: 18px; }
    .intro p { color: #cbd5e1; line-height: 1.8; font-size: 15px; }

    .badge {
      margin-top: 35px;
      display: inline-block;
      width: fit-content;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      font-size: 13px;
    }

    .form-area { padding: 45px; overflow-y: auto; }

    .tabs {
      display: flex;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 5px;
      margin-bottom: 30px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border-radius: 9px;
      background: transparent;
      font-size: 15px;
      font-weight: 700;
      color: #64748b;
    }

    .tab.active {
      background: white;
      color: #1d4ed8;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .form-section { display: none; }
    .form-section.active { display: block; }

    h1 { font-size: 27px; color: #0f172a; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #64748b; margin-bottom: 25px; }

    .label {
      display: block;
      margin-top: 14px;
      margin-bottom: 7px;
      color: #334155;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid #cbd5e1;
      border-radius: 11px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    /* 입력칸 + 오른쪽 작은 버튼 (이메일 중복확인 / 비밀번호 보기) */
    .email-row    { display: grid; grid-template-columns: 1fr 120px; gap: 8px; }
    .password-row { display: grid; grid-template-columns: 1fr 80px;  gap: 8px; }

    button { border: none; cursor: pointer; font-family: inherit; }

    .small-btn {
      height: 48px;
      border-radius: 11px;
      background: #e0e7ff;
      color: #1d4ed8;
      font-weight: 700;
    }
    .small-btn:hover { background: #c7d2fe; }

    .main-btn {
      width: 100%;
      height: 50px;
      margin-top: 24px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-size: 15px;
      font-weight: 800;
      transition: 0.2s;
    }
    .main-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25); }
    .main-btn:disabled { opacity: 0.6; cursor: default; transform: none; box-shadow: none; }

    .naver-btn {
      width: 100%;
      height: 50px;
      margin-top: 12px;
      border-radius: 12px;
      background: #03c75a;
      color: white;
      font-size: 15px;
      font-weight: 800;
      transition: 0.2s;
    }
    .naver-btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .divider {
      display: flex;
      align-items: center;
      margin-top: 20px;
      margin-bottom: 8px;
      color: #94a3b8;
      font-size: 12px;
    }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; }
    .divider span { padding: 0 12px; }

    .message { min-height: 20px; margin-top: 10px; font-size: 13px; color: #475569; }
    .success { color: #15803d; }
    .error { color: #dc2626; }

    .switch-link { margin-top: 18px; text-align: center; font-size: 13px; color: #64748b; }
    .switch-link button { background: none; color: #1d4ed8; font-size: 13px; font-weight: 700; text-decoration: underline; }

    @media (max-width: 800px) {
      .container { grid-template-columns: 1fr; max-width: 520px; }
      .intro { padding: 35px; }
      .form-area { padding: 35px; }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="intro">
      <a href="../index.html" class="logo">맞집</a>
      <h2>내게 맞는 집,<br>더 가벼운 주거</h2>
      <p>
        맞집에서 회원가입하고<br>
        나에게 맞는 주거비 절약 진단과<br>
        청년 주거지원 정책을 받아보세요.
      </p>
      <div class="badge">비밀번호는 암호화되어 안전하게 보관돼요</div>
    </div>

    <div class="form-area">
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" id="tab-signup" role="tab" aria-selected="true">회원가입</button>
        <button type="button" class="tab" id="tab-login" role="tab" aria-selected="false">로그인</button>
      </div>

      <!-- 회원가입 -->
      <form id="signup-form" class="form-section active" novalidate>
        <h1>회원가입</h1>
        <p class="subtitle">맞집을 시작해보세요.</p>

        <label class="label" for="signup-email">이메일 (로그인 아이디)</label>
        <div class="email-row">
          <input id="signup-email" name="email" type="email" placeholder="example@email.com" autocomplete="email" />
          <button type="button" id="check-email-btn" class="small-btn">중복확인</button>
        </div>
        <div id="email-message" class="message"></div>

        <label class="label" for="signup-password">비밀번호</label>
        <div class="password-row">
          <input id="signup-password" name="password" type="password" placeholder="8자 이상" autocomplete="new-password" />
          <button type="button" id="toggle-signup-password-btn" class="small-btn">보기</button>
        </div>

        <label class="label" for="signup-nickname">이름 (닉네임)</label>
        <input id="signup-nickname" name="nickname" type="text" maxlength="50" placeholder="화면에 표시될 이름" autocomplete="nickname" />

        <button type="submit" id="signup-btn" class="main-btn">회원가입</button>
        <div id="signup-message" class="message"></div>

        <p class="switch-link">이미 계정이 있나요? <button type="button" data-switch="login">로그인</button></p>
      </form>

      <!-- 로그인 -->
      <form id="login-form" class="form-section" novalidate>
        <h1>로그인</h1>
        <p class="subtitle">맞집에 다시 오신 것을 환영합니다.</p>

        <label class="label" for="login-email">이메일</label>
        <input id="login-email" name="email" type="email" placeholder="example@email.com" autocomplete="email" />

        <label class="label" for="login-password">비밀번호</label>
        <div class="password-row">
          <input id="login-password" name="password" type="password" placeholder="비밀번호" autocomplete="current-password" />
          <button type="button" id="toggle-login-password-btn" class="small-btn">보기</button>
        </div>

        <button type="submit" id="login-btn" class="main-btn">로그인</button>

        <div class="divider"><span>또는</span></div>

        <button type="button" id="naver-login-btn" class="naver-btn">네이버로 로그인</button>
        <div id="login-message" class="message"></div>

        <p class="switch-link">계정이 없나요? <button type="button" data-switch="signup">회원가입</button></p>
      </form>
    </div>

  </div>

  <script src="../../js/api/auth.js?v=20260921b"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    // ---------- 탭 전환 (같은 화면에서 폼만 바뀐다) ----------
    function showTab(name) {
      const isLogin = name === "login";
      $("signup-form").classList.toggle("active", !isLogin);
      $("login-form").classList.toggle("active", isLogin);
      $("tab-signup").classList.toggle("active", !isLogin);
      $("tab-login").classList.toggle("active", isLogin);
      $("tab-signup").setAttribute("aria-selected", String(!isLogin));
      $("tab-login").setAttribute("aria-selected", String(isLogin));
      document.title = isLogin ? "맞집 | 로그인" : "맞집 | 회원가입";
      history.replaceState(null, "", isLogin ? "#login" : "#signup");
    }

    $("tab-signup").addEventListener("click", () => showTab("signup"));
    $("tab-login").addEventListener("click", () => showTab("login"));
    document.querySelectorAll("[data-switch]").forEach((btn) => {
      btn.addEventListener("click", () => showTab(btn.dataset.switch));
    });

    showTab(location.hash === "#login" ? "login" : "signup");
    window.addEventListener("hashchange", () => showTab(location.hash === "#login" ? "login" : "signup"));

    function setMessage(elementId, message, success) {
      const el = $(elementId);
      el.textContent = message;
      el.classList.remove("success", "error");
      el.classList.add(success ? "success" : "error");
    }

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    function bindPasswordToggle(buttonId, inputId) {
      const btn = $(buttonId);
      btn.addEventListener("click", () => {
        const input = $(inputId);
        const hidden = input.type === "password";
        input.type = hidden ? "text" : "password";
        btn.textContent = hidden ? "숨기기" : "보기";
      });
    }
    bindPasswordToggle("toggle-signup-password-btn", "signup-password");
    bindPasswordToggle("toggle-login-password-btn", "login-password");

    // ---------- 회원가입 ----------
    // 이메일 중복확인을 통과한 이메일. 입력이 바뀌면 다시 확인해야 한다.
    let checkedEmail = null;

    $("signup-email").addEventListener("input", () => {
      checkedEmail = null;
      $("email-message").textContent = "";
    });

    $("check-email-btn").addEventListener("click", async () => {
      const email = $("signup-email").value.trim();

      if (!isValidEmail(email)) {
        checkedEmail = null;
        setMessage("email-message", "올바른 이메일 형식으로 입력해주세요.", false);
        return;
      }

      try {
        const duplicated = await CustomHouseAuthApi.checkEmail(email);
        if (duplicated) {
          checkedEmail = null;
          setMessage("email-message", "이미 사용 중인 이메일입니다.", false);
        } else {
          checkedEmail = email;
          setMessage("email-message", "사용 가능한 이메일입니다.", true);
        }
      } catch (err) {
        checkedEmail = null;
        setMessage("email-message", err.message || "이메일 중복확인 중 오류가 발생했습니다.", false);
      }
    });

    $("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = $("signup-email").value.trim();
      const password = $("signup-password").value;
      const nickname = $("signup-nickname").value.trim();

      if (checkedEmail !== email) {
        setMessage("signup-message", "이메일 중복확인을 먼저 해주세요.", false);
        return;
      }
      if (password.length < 8 || password.length > 64) {
        setMessage("signup-message", "비밀번호는 8~64자로 입력해주세요.", false);
        return;
      }
      if (!nickname) {
        setMessage("signup-message", "이름(닉네임)을 입력해주세요.", false);
        return;
      }

      $("signup-btn").disabled = true;
      setMessage("signup-message", "가입 처리 중...", true);

      try {
        await CustomHouseAuthApi.signup({ email, password, nickname });

        // 가입이 끝나면 같은 화면에서 로그인 탭으로 넘어가고, 방금 쓴 이메일을 채워둔다.
        $("login-email").value = email;
        $("login-password").value = "";
        $("signup-form").reset();
        checkedEmail = null;
        $("email-message").textContent = "";
        $("signup-message").textContent = "";
        $("signup-btn").disabled = false;
        showTab("login");
        setMessage("login-message", "회원가입 성공! 비밀번호를 입력해 로그인해주세요.", true);
        $("login-password").focus();
      } catch (err) {
        setMessage("signup-message", err.message || "회원가입 중 오류가 발생했습니다.", false);
        $("signup-btn").disabled = false;
      }
    });

    // ---------- 로그인 ----------
    $("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = $("login-email").value.trim();
      const password = $("login-password").value;

      if (!isValidEmail(email)) {
        setMessage("login-message", "올바른 이메일 형식으로 입력해주세요.", false);
        return;
      }
      if (!password) {
        setMessage("login-message", "비밀번호를 입력해주세요.", false);
        return;
      }

      $("login-btn").disabled = true;
      setMessage("login-message", "로그인 중...", true);

      try {
        await CustomHouseAuthApi.login({ email, password });
        window.location.href = "../index.html";
      } catch (err) {
        setMessage("login-message", err.message || "로그인 중 오류가 발생했습니다.", false);
        $("login-btn").disabled = false;
      }
    });

    $("naver-login-btn").addEventListener("click", () => CustomHouseAuthApi.loginWithNaver());
  </script>
</body>
</html>
