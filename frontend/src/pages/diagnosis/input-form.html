<!DOCTYPE html>
<!-- [담당: 양혜승] AI 주거비 절약 진단 - 조건 입력 폼 (핵심 기능 화면) -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맞집 | 주거비 절약 진단</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/main.css?v=20260915b" />
  <script src="../../js/config.js?v=20260915d"></script>
  <script>
    // 직장 위치 주소검색(카카오 Geocoder)용 SDK. 키 없으면 그냥 안 불러오고, 아래 스크립트가
    // 기존 드롭다운 UI로 폴백한다 (report-result.html의 지도 연동과 같은 패턴).
    if (window.CUSTOMHOUSE_CONFIG && window.CUSTOMHOUSE_CONFIG.KAKAO_MAP_APP_KEY) {
      const kakaoSdkScript = document.createElement("script");
      kakaoSdkScript.src =
        "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" +
        window.CUSTOMHOUSE_CONFIG.KAKAO_MAP_APP_KEY +
        "&libraries=services&autoload=false";
      document.head.appendChild(kakaoSdkScript);
    }
  </script>
  <!-- 주소 검색(우편번호) 팝업 - 다음(카카오) 공개 서비스, 별도 키 불필요 -->
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>
  <div id="app-header"></div>

  <main class="max-w-xl mx-auto px-4 py-12">
    <h1 class="text-2xl font-extrabold mb-1">AI 주거비 절약 진단</h1>
    <p class="text-sm text-gray-500 mb-8">
      월급, 보증금, 직장 위치를 입력하면 맞집이 실질 주거비가 가장 낮은
      지역과 받을 수 있는 정부 지원 정책을 찾아드려요.
    </p>

    <form id="diagnosis-form" class="card p-6 space-y-6">
      <div>
        <label class="block text-sm font-semibold mb-1">월급 (세후, 만원)</label>
        <input type="number" name="monthlyIncome" required min="0" placeholder="예: 280"
               class="w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2"
               style="--tw-ring-color:var(--brand-500)" />
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">현재 보유 보증금 (만원)</label>
        <input type="number" name="deposit" required min="0" placeholder="예: 800"
               class="w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2"
               style="--tw-ring-color:var(--brand-500)" />
        <p class="text-xs text-gray-400 mt-1">지금 수중에 있는 현금 기준이에요.</p>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">희망 보증금/전세액 (만원, 선택)</label>
        <input type="number" name="desiredDeposit" min="0" placeholder="입력하지 않으면 보유 보증금 그대로 사용"
               class="w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2"
               style="--tw-ring-color:var(--brand-500)" />
        <p class="text-xs text-gray-400 mt-1">입력한 금액 이하의 보증금 매물만 검색돼요. 대출 등을 더한 목표 금액이라 보유 보증금보다 커도 괜찮아요.</p>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">희망 월세 (만원, 선택)</label>
        <input type="number" name="desiredRent" min="0" placeholder="입력하지 않으면 소득 기준으로 자동 계산"
               class="w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2"
               style="--tw-ring-color:var(--brand-500)" />
        <p class="text-xs text-gray-400 mt-1">입력한 금액 이하의 월세 매물만 검색돼요.</p>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">직장 위치</label>

        <div id="work-address-ui" class="hidden">
          <div class="flex gap-2">
            <input type="text" id="work-address-display" readonly placeholder="주소를 검색해주세요"
                   class="flex-1 border border-gray-200 rounded-lg px-3 py-2 bg-gray-50 cursor-default" />
            <button type="button" id="search-address-btn"
                    class="px-4 py-2 rounded-lg border border-gray-200 text-sm font-semibold whitespace-nowrap">
              주소 검색
            </button>
          </div>
          <p id="work-hub-match" class="text-xs text-gray-400 mt-1 hidden"></p>
        </div>
        <!-- 주소 검색으로 얻은 정확한 좌표. 있으면 AI 엔진이 구 단위 대표좌표 대신 이 좌표로
             통근시간을 계산한다 (address-match-util.js/제출 스크립트 참고). -->
        <input type="hidden" name="workLat" id="work-lat-input" />
        <input type="hidden" name="workLon" id="work-lon-input" />

        <!-- customhouse-ai/app/data/work_locations.json과 동일하게 유지해야 함 (서울 25개 자치구
             전체 + 분당구). 카카오맵 키가 있으면 위 주소 검색 UI로 대체되고, 검색 결과가 이 중
             가장 가까운 곳으로 자동 매칭되어 이 select의 값이 채워진다 (address-match-util.js).
             키가 없으면 이 드롭다운을 그대로 쓴다 (폴백). -->
        <select name="workLocation" id="work-location-select" required
                class="w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2"
                style="--tw-ring-color:var(--brand-500)">
          <option value="">직장 위치를 선택하세요</option>
          <option value="강남구">강남구</option>
          <option value="강동구">강동구</option>
          <option value="강북구">강북구</option>
          <option value="강서구">강서구</option>
          <option value="관악구">관악구</option>
          <option value="광진구">광진구</option>
          <option value="구로구">구로구(가산디지털단지)</option>
          <option value="금천구">금천구</option>
          <option value="노원구">노원구</option>
          <option value="도봉구">도봉구</option>
          <option value="동대문구">동대문구</option>
          <option value="동작구">동작구</option>
          <option value="마포구">마포구</option>
          <option value="서대문구">서대문구</option>
          <option value="서초구">서초구</option>
          <option value="성동구">성동구(성수)</option>
          <option value="성북구">성북구</option>
          <option value="송파구">송파구</option>
          <option value="양천구">양천구</option>
          <option value="영등포구">영등포구(여의도)</option>
          <option value="용산구">용산구</option>
          <option value="은평구">은평구</option>
          <option value="종로구">종로구</option>
          <option value="중구">중구</option>
          <option value="중랑구">중랑구</option>
          <option value="분당구">분당구(판교)</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">희망 최대 통근시간</label>
        <select name="maxCommuteMinutes"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2"
                style="--tw-ring-color:var(--brand-500)">
          <option value="30">30분 이내</option>
          <option value="40" selected>40분 이내</option>
          <option value="50">50분 이내</option>
        </select>
      </div>

      <details class="text-sm">
        <summary class="cursor-pointer font-semibold text-gray-600">정책 자격 판별을 위한 추가 정보 (선택)</summary>
        <div class="mt-3 space-y-3">
          <div>
            <label class="block text-xs text-gray-500 mb-1">나이</label>
            <input type="number" name="age" min="0" max="120" placeholder="예: 28"
                   class="w-full border border-gray-200 rounded-lg px-3 py-2" />
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">보유 자산 (만원, 보증금 포함 총자산)</label>
            <input type="number" name="assets" min="0" placeholder="예: 3000"
                   class="w-full border border-gray-200 rounded-lg px-3 py-2" />
            <p class="text-xs text-gray-400 mt-1">청년월세지원·버팀목대출 등 일부 정책은 소득뿐 아니라 자산 기준도 봐요.</p>
          </div>
          <label class="flex items-center gap-2 text-xs text-gray-600">
            <input type="checkbox" name="noHouseholder" />
            무주택 세대주(예정자)입니다
          </label>
        </div>
      </details>

      <p id="form-error" class="text-sm text-red-500 hidden"></p>

      <button type="submit" id="submit-btn"
              class="w-full py-3 rounded-full text-white font-semibold brand-gradient disabled:opacity-50">
        진단 결과 보기
      </button>
    </form>
  </main>

  <div id="app-footer"></div>

  <script src="../../js/components/header.js?v=20260915b"></script>
  <script src="../../js/components/footer.js?v=20260915b"></script>
  <script src="../../js/api/recommendation.js?v=20260915b"></script>
  <script src="../../js/utils/address-match-util.js?v=20260915d"></script>
  <script>
    renderHeader("diagnosis");
    renderFooter();

    const form = document.getElementById("diagnosis-form");
    const errorEl = document.getElementById("form-error");
    const submitBtn = document.getElementById("submit-btn");

    // --- 직장 위치: 카카오 주소검색 -> 가장 가까운 직장 권역으로 자동 매칭 (키 없으면 드롭다운 폴백) ---
    (function setupWorkLocationAddressSearch() {
      const kakaoKey = window.CUSTOMHOUSE_CONFIG && window.CUSTOMHOUSE_CONFIG.KAKAO_MAP_APP_KEY;
      if (!kakaoKey) return; // 기본 드롭다운(#work-location-select)이 이미 보이는 상태라 그대로 둔다.

      const addressUi = document.getElementById("work-address-ui");
      const workSelect = document.getElementById("work-location-select");
      const addressDisplay = document.getElementById("work-address-display");
      const hubMatchEl = document.getElementById("work-hub-match");
      const searchBtn = document.getElementById("search-address-btn");
      const workLatInput = document.getElementById("work-lat-input");
      const workLonInput = document.getElementById("work-lon-input");

      function waitForKakaoServices(retriesLeft, cb) {
        if (window.kakao && window.kakao.maps) {
          window.kakao.maps.load(() => cb(true));
        } else if (retriesLeft > 0) {
          setTimeout(() => waitForKakaoServices(retriesLeft - 1, cb), 100);
        } else {
          cb(false);
        }
      }

      waitForKakaoServices(50, (ready) => {
        if (!ready || !window.daum || !window.daum.Postcode || !window.CustomHouseAddressMatchUtil) {
          return; // SDK/우편번호 스크립트 로드 실패 -> 드롭다운 폴백 유지
        }

        addressUi.classList.remove("hidden");
        workSelect.classList.add("hidden");

        searchBtn.addEventListener("click", () => {
          new daum.Postcode({
            oncomplete: (data) => {
              const address = data.roadAddress || data.jibunAddress;
              addressDisplay.value = address;

              const geocoder = new kakao.maps.services.Geocoder();
              geocoder.addressSearch(address, (result, status) => {
                if (status !== kakao.maps.services.Status.OK || !result.length) {
                  workLatInput.value = "";
                  workLonInput.value = "";
                  hubMatchEl.textContent = "주소의 좌표를 찾지 못했어요. 아래 목록에서 직접 선택해주세요.";
                  hubMatchEl.classList.remove("hidden");
                  addressUi.classList.add("hidden");
                  workSelect.classList.remove("hidden");
                  return;
                }

                const lat = parseFloat(result[0].y);
                const lon = parseFloat(result[0].x);

                // 통근시간 계산 자체는 이 정확한 좌표(workLat/workLon)로 하고, workLocation(구
                // 이름)은 "지원 지역인지" 표시/정책 매칭용 라벨로만 가장 가까운 구를 채워둔다.
                workLatInput.value = lat;
                workLonInput.value = lon;
                const nearest = CustomHouseAddressMatchUtil.findNearestWorkHub(lat, lon);
                workSelect.value = nearest.hub;
                hubMatchEl.textContent =
                  `→ 이 주소로 정확하게 통근시간을 계산해요 (참고: "${nearest.label}"에서 직선거리 약 ` +
                  `${nearest.distanceKm.toFixed(1)}km · 실제 통근시간은 경로에 따라 다를 수 있어요)`;
                hubMatchEl.classList.remove("hidden");
              });
            },
          }).open();
        });
      });
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.add("hidden");

      const fd = new FormData(form);
      const condition = {
        monthlyIncome: Number(fd.get("monthlyIncome")),
        deposit: Number(fd.get("deposit")),
        desiredDeposit: fd.get("desiredDeposit") ? Number(fd.get("desiredDeposit")) : null,
        desiredRent: fd.get("desiredRent") ? Number(fd.get("desiredRent")) : null,
        workLocation: fd.get("workLocation"),
        workLat: fd.get("workLat") ? Number(fd.get("workLat")) : null,
        workLon: fd.get("workLon") ? Number(fd.get("workLon")) : null,
        maxCommuteMinutes: Number(fd.get("maxCommuteMinutes")),
        age: fd.get("age") ? Number(fd.get("age")) : null,
        assets: fd.get("assets") ? Number(fd.get("assets")) : null,
        noHouseholder: fd.get("noHouseholder") === "on",
      };

      submitBtn.disabled = true;
      submitBtn.textContent = "분석 중...";

      try {
        const result = await CustomHouseRecommendationApi.requestDiagnosis(condition);
        sessionStorage.setItem("customhouse:lastDiagnosis", JSON.stringify(result));
        window.location.href = "report-result.html";
      } catch (err) {
        errorEl.textContent = err.message || "진단 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.";
        errorEl.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.textContent = "진단 결과 보기";
      }
    });
  </script>
</body>
</html>
