<!DOCTYPE html>
<!-- [담당: 양혜승] AI 주거비 절약 진단 - 추천 매물 리포트 (더미 매물 CSV 기반, 2026-09-28)
     추천 매물은 docs/samples/dummyhouses 의 더미 매물이고, 국토부 실거래가는 매물마다 "실거래 참고"로만 보여준다.
     기존 국토부 실거래가 기준 리포트(report-result.html)는 그대로 두고, 이 페이지 하단 탭에서 같은 조건으로 불러온다.
     레이아웃은 report-result.html과 같다: 좌측 2단(진단 리포트/정책 추천) · 가운데 큰 지도 · 우측 탭(월세/전세). -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맞집 | 추천 매물 리포트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/main.css?v=20260915b" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="../../js/config.js?v=20260915c"></script>
  <script>
    // config.js에 카카오맵 키가 있으면 SDK를 끼워넣는다 (autoload=false로 즉시 렌더 방지).
    if (window.CUSTOMHOUSE_CONFIG && window.CUSTOMHOUSE_CONFIG.KAKAO_MAP_APP_KEY) {
      const kakaoSdkScript = document.createElement("script");
      kakaoSdkScript.src =
        "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" +
        window.CUSTOMHOUSE_CONFIG.KAKAO_MAP_APP_KEY +
        "&autoload=false";
      document.head.appendChild(kakaoSdkScript);
    }
  </script>

  <style>
    body { padding-bottom: 52px; } /* 하단 고정 탭 바(52px)에 가리지 않게 */

    /* 직방 지도 화면처럼 좌우 여백 없이 화면을 꽉 채운다: 상단 슬림 바 + 남는 높이를 전부 쓰는 3열(진단/지도/매물 목록) */
    .report-main { padding: 0; }
    .report-topbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 24px;
      padding: 10px 20px; background: #fff; border-bottom: 1px solid #e2e8f0;
    }
    .report-titlebox h1 { font-size: 19px; font-weight: 800; line-height: 1.3; }
    .report-titlebox p { font-size: 12.5px; line-height: 1.45; }
    .topbar-right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
    .report-layout .card { border-radius: 0; box-shadow: none; }
    .report-layout .report-col + .report-col > .card { border-left: 1px solid #e2e8f0; }
    .report-layout .report-col:first-child > .card + .card { border-top: 1px solid #e2e8f0; }

    .report-layout {
      display: grid;
      /* 왼쪽(주거진단 리포트/주거정책 추천)은 화면 폭의 30%, 최소 420px ~ 최대 560px. 오른쪽 매물 목록은 460px 고정 */
      grid-template-columns: clamp(420px, 30vw, 560px) 1fr 460px;
      gap: 0;
      height: 760px; /* 실제 높이는 fitLayout()이 화면 높이에 맞춰 정한다 */
    }
    .report-col { height: 100%; min-height: 0; display: flex; flex-direction: column; gap: 0; }
    .report-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }
    .report-map-card { height: 100%; overflow: hidden; position: relative; }
    #map-container { height: 100%; }

    .report-tabs { display: flex; flex: none; border-bottom: 1px solid #edf1f5; }
    .report-tab {
      flex: 1; padding: 14px 0; text-align: center; font-size: 14px; font-weight: 800; color: #94a3b8;
      border-bottom: 2px solid transparent;
    }
    .report-tab.active { color: var(--brand-600, #1B2A4A); border-bottom-color: var(--brand-600, #1B2A4A); }
    .report-tab-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .report-list-box { flex: 1; min-height: 0; overflow-y: auto; }
    /* 카드끼리 실선으로 구분한다 (사진이 없는 매물도 경계가 분명하게). 목록 박스 안쪽 여백 없이 양 끝까지 선을 긋는다 */
    .report-list-box > ul > li { border-bottom: 1px solid #cbd5e1; }
    .report-list-box > ul > li:hover { background: #f8fafc; }
    .cost-boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .cost-box { border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 10px; background: #f8fafc; }
    .cost-box.conv { background: #eff6ff; border-color: #bfdbfe; }
    .cost-box .lbl { font-size: 11px; font-weight: 700; color: #64748b; }
    .cost-box .val { font-size: 16px; font-weight: 800; color: #0f172a; line-height: 1.3; }
    .cost-box.conv .val { color: #1d4ed8; }
    .cost-box .sub { font-size: 11px; color: #94a3b8; line-height: 1.4; }
    /* 주거진단 리포트: 소득수준별 RIR / 적정 월세 표 */
    .rir-box { margin-bottom: 14px; }
    .rir-title { font-size: 12px; font-weight: 800; color: #334155; margin-bottom: 6px; }
    .rir-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .rir-table th { text-align: left; font-size: 11px; font-weight: 700; color: #94a3b8; padding: 4px 8px; border-bottom: 1px solid #e2e8f0; }
    .rir-table th.num, .rir-table td.num { text-align: right; }
    .rir-table td { padding: 7px 8px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .rir-table tr.metro td { background: #eff6ff; font-weight: 800; color: #1d4ed8; }
    .rir-table td .grp { display: block; font-size: 11px; font-weight: 500; color: #94a3b8; }
    .rir-foot { margin-top: 8px; font-size: 11px; line-height: 1.55; color: #94a3b8; }
    .listing-no { margin-top: 10px; font-size: 10.5px; color: #94a3b8; letter-spacing: 0.01em; }

    @media (max-width: 1100px) {
      .report-layout { grid-template-columns: 1fr; height: auto !important; }
      .report-layout .report-col + .report-col > .card { border-left: 0; border-top: 1px solid #e2e8f0; }
      .report-col { height: auto; }
      .report-map-card { height: 420px; }
      .report-panel { max-height: 480px; }
      .report-list-box { max-height: 640px; }
    }

    /* 주택 유형 필터 - 필(pill) 토글 칩 */
    .building-type-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .building-type-filter-label { font-size: 14px; font-weight: 800; color: #334155; flex: none; }
    .type-chip { position: relative; display: inline-flex; cursor: pointer; }
    .type-chip input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .type-chip span {
      display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 999px;
      border: 1.5px solid #e2e8f0; background: #f8fafc; color: #94a3b8; font-size: 14px; font-weight: 700;
      transition: background-color .15s, border-color .15s, color .15s; user-select: none;
    }
    .type-chip:hover span { border-color: #cbd5e1; color: #64748b; }
    .type-chip input:checked + span { background: var(--brand-600, #1B2A4A); border-color: var(--brand-600, #1B2A4A); color: #fff; }
    .type-chip input:focus-visible + span { outline: 2px solid var(--brand-600, #1B2A4A); outline-offset: 2px; }
    .requery-msg { font-size: 13px; color: #94a3b8; }
    .requery-msg.error { color: #dc2626; font-weight: 700; }

    .building-name-link {
      background: none; border: none; padding: 0; font: inherit; color: inherit; cursor: pointer;
      text-decoration: underline; text-underline-offset: 2px; text-decoration-color: #cbd5e1;
    }
    .building-name-link:hover { color: var(--brand-600, #1B2A4A); }

    @keyframes card-flash-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(27, 42, 74, 0); }
      25% { box-shadow: 0 0 0 3px rgba(27, 42, 74, 0.35); }
    }
    .card-flash { animation: card-flash-pulse 1.1s ease; }

    /* 매물 사진 자리: 사진 연결 전(PHOTO_PLACEHOLDER)에는 회색 박스 */
    .listing-photo {
      width: 100%; height: 132px; border-radius: 10px; margin-bottom: 12px; overflow: hidden;
      background: #f1f5f9; color: #94a3b8; font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .listing-photo img { width: 100%; height: 100%; object-fit: cover; }

    .listing-details { border-top: 1px solid #f1f5f9; margin-top: 10px; padding-top: 8px; }
    .listing-details summary { cursor: pointer; font-size: 12px; font-weight: 700; color: #475569; }
    .listing-details .body { font-size: 12px; color: #64748b; line-height: 1.6; margin-top: 6px; }

    /* 통근시간 산출 방식 배지 - 하단 탭 바 위에 뜬다 */
    #commute-source-badge {
      position: fixed; right: 14px; bottom: 74px; z-index: 40; font-size: 11px; padding: 5px 10px;
      border-radius: 999px; background: rgba(255, 255, 255, 0.92); border: 1px solid #e2e8f0; color: #94a3b8;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }
    #commute-source-badge.estimate { color: #b45309; border-color: #fde68a; background: #fffbeb; }

    /* 하단 고정 탭 바: 추천 매물 리포트(현재) <-> 실거래가 기준 리포트(기존) */
    .source-tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; height: 52px; display: flex;
      background: #fff; border-top: 1px solid #e2e8f0; box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.05);
    }
    .source-tab {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 14px; font-weight: 800; color: #94a3b8; border-top: 3px solid transparent;
    }
    .source-tab.active { color: var(--brand-600, #1B2A4A); border-top-color: var(--brand-600, #1B2A4A); cursor: default; }
    .source-tab:not(.active):hover { color: #64748b; background: #f8fafc; }
    .source-tab:disabled { opacity: .6; cursor: progress; }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main class="report-main">
    <div id="empty-state" class="hidden text-center py-24 px-4">
      <p class="text-gray-500 mb-4">진단 결과가 없어요. 먼저 조건을 입력해주세요.</p>
      <a href="input-form.html" class="px-6 py-2 rounded-full text-white brand-gradient">진단하러 가기</a>
    </div>

    <div id="commute-source-badge" class="hidden"></div>

    <div id="result-content" class="hidden">
      <div class="report-topbar">
        <div class="report-titlebox">
          <h1>추천 매물 리포트</h1>
          <p class="font-semibold hidden" id="work-address-line" style="color:var(--brand-600)"></p>
          <p class="text-gray-500" id="summary-line"></p>
        </div>
        <div class="topbar-right">
      <div class="building-type-filter">
        <span class="building-type-filter-label">주택 유형</span>
        <label class="type-chip"><input type="checkbox" class="building-type-checkbox" value="아파트" /><span>아파트</span></label>
        <label class="type-chip"><input type="checkbox" class="building-type-checkbox" value="오피스텔" /><span>오피스텔</span></label>
        <label class="type-chip"><input type="checkbox" class="building-type-checkbox" value="연립다세대" /><span>연립·다세대</span></label>
        <label class="type-chip"><input type="checkbox" class="building-type-checkbox" value="단독다가구" /><span>단독·다가구</span></label>
        <span id="requery-msg" class="requery-msg"></span>
      </div>
          <a href="input-form.html" class="text-sm underline text-gray-500 whitespace-nowrap">조건 다시 입력하기</a>
        </div>
      </div>

      <div class="report-layout">
        <!-- 좌: 주거진단 리포트 + 주거정책 추천 -->
        <div class="report-col">
          <div class="card p-5 report-panel">
            <h2 class="font-bold mb-3">주거진단 리포트</h2>
            <div class="grid grid-cols-2 gap-3 mb-4">
              <div>
                <div class="text-xs text-gray-400 mb-1" id="afford-label" title="RIR 통계를 불러오지 못해 소득의 20%를 기본값으로 썼어요">적정 월세 상한 <span class="text-gray-300">(기본값: 소득의 20%)</span></div>
                <div class="text-lg font-bold" id="affordable-rent">-</div>
              </div>
              <div>
                <div class="text-xs text-gray-400 mb-1" id="rir-label" title="RIR 통계를 불러오지 못해 기본값(소득의 20%)을 썼어요. 소득 대비 주택임대료 비율 = 월임대료 ÷ 월가구소득">주거비 비율(RIR, 기본값)</div>
                <div class="text-lg font-bold" id="rir">-</div>
              </div>
            </div>
            <div class="rir-box hidden" id="rir-box">
              <div class="rir-title">소득수준별 RIR과 내 월소득 기준 적정 월세</div>
              <table class="rir-table">
                <thead><tr><th>구분</th><th class="num">RIR</th><th class="num">적정 월세</th></tr></thead>
                <tbody id="rir-table-body"></tbody>
              </table>
              <p class="rir-foot" id="rir-foot"></p>
            </div>
            <div style="height: 220px; flex: none">
              <canvas id="savings-chart"></canvas>
            </div>
            <p class="text-xs text-gray-400 mt-3" id="disclaimer"></p>
            <p class="text-xs mt-2" id="rate-note" style="color:#64748b"></p>
          </div>

          <div class="card p-4 report-panel">
            <h2 class="font-bold mb-1">주거정책 추천</h2>
            <p class="text-xs text-gray-400 mb-3">매물 추천에 반영된 정책들이에요.</p>
            <div class="overflow-x-auto">
              <table class="w-full text-[13px] leading-snug" style="table-layout: fixed">
                <thead class="bg-gray-50">
                  <tr>
                    <th class="text-left align-middle px-2 py-2 text-xs font-semibold text-gray-500" style="width: 20%">기관명</th>
                    <th class="text-left align-middle px-2 py-2 text-xs font-semibold text-gray-500" style="width: 25%">지원정책명</th>
                    <th class="text-left align-middle px-2 py-2 text-xs font-semibold text-gray-500">지원혜택</th>
                  </tr>
                </thead>
                <tbody id="policy-table-body"></tbody>
              </table>
            </div>
            <p id="policy-empty" class="text-sm text-gray-400 hidden mt-2">매칭된 지원 정책이 없어요.</p>
          </div>
        </div>

        <!-- 중: 추천 매물 지도 -->
        <div class="report-col">
          <div class="card p-0 report-map-card">
            <div id="map-container"></div>
          </div>
        </div>

        <!-- 우: 월세/전세 탭 -->
        <div class="report-col">
          <div class="card p-0 report-panel" style="overflow: hidden">
            <div class="report-tabs">
              <button type="button" class="report-tab active" data-tab="wolse">월세 매물</button>
              <button type="button" class="report-tab" data-tab="jeonse">전세 매물</button>
            </div>

            <div id="wolse-panel" class="report-tab-panel">
              <div id="wolse-box" class="report-list-box">
                <ul id="wolse-list"></ul>
                <p id="wolse-empty" class="text-sm text-gray-400 hidden p-4">조건에 맞는 월세 매물을 찾지 못했어요.</p>
              </div>
            </div>

            <div id="jeonse-panel" class="report-tab-panel hidden">
              <p class="text-xs text-gray-400 px-4 pt-3" id="jeonse-note"></p>
              <div id="jeonse-box" class="report-list-box">
                <ul id="jeonse-list"></ul>
                <p id="jeonse-empty" class="text-sm text-gray-400 hidden p-4">조건에 맞는 전세 매물을 찾지 못했어요.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 하단 탭 바: 추천 매물 리포트(현재) / 실거래가 기준 리포트(기존 report-result.html 보존) -->
  <nav class="source-tabbar hidden" id="source-tabbar" aria-label="리포트 종류">
    <button type="button" class="source-tab active" aria-current="page">🏠 추천 매물 리포트</button>
    <button type="button" class="source-tab" id="legacy-report-tab">📊 실거래가 기준 리포트 (기존)</button>
  </nav>

  <script src="../../js/components/header.js?v=20260915b"></script>
  <script src="../../js/api/recommendation.js?v=20260928a"></script>
  <script src="../../js/utils/chart-util.js?v=20260915d"></script>
  <script src="../../js/utils/map-util.js?v=20260928a"></script>
  <script src="../../js/utils/map-cluster-util.js?v=20260928a"></script>
  <script>
    renderHeader("diagnosis"); // 지도 화면이라 푸터는 두지 않는다 (직방 지도 화면과 같이 화면을 꽉 채운다)

    // 매물 설명/중개사 문구는 앞으로 "신규 매물 생성" 탭에서 사용자가 직접 입력할 수 있으니 화면에 넣기 전에 항상 이스케이프한다.
    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    }

    // 만원 단위 금액을 읽기 쉽게: 150000 -> "15억", 14500 -> "1억 4,500만원", 500 -> "500만원"
    function fmtMoney(man) {
      const n = Number(man || 0);
      if (n >= 10000) {
        const eok = Math.floor(n / 10000);
        const rest = n % 10000;
        return rest ? `${eok}억 ${rest.toLocaleString()}만원` : `${eok}억`;
      }
      return `${n.toLocaleString()}만원`;
    }

    // 만원 단위 비용: 소수 첫째 자리까지, 정수면 소수점 생략 (33.8 / 42)
    function fmtNum(v) {
      const n = Number(v ?? 0);
      return (Math.round(n * 10) / 10).toLocaleString(undefined, { maximumFractionDigits: 1 });
    }

    // 이율(연 %)은 소수 둘째 자리까지: 6.35
    function fmtRate(v) {
      return Number(v ?? 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
    }

    const PHOTO_PLACEHOLDER = "PHOTO_PLACEHOLDER";

    // localStorage 사용 이유: report-result.html 참고 (탭이 바뀌거나 세션이 끊겨도 유지되어야 함).
    const raw = localStorage.getItem("customhouse:lastListingDiagnosis");

    // 이 결과를 받을 때 쓴 조건. 기존 실거래가 리포트에서 주택 유형 등을 바꿔 다시 조회하면 공용 조건(lastDiagnosisCondition)만
    // 바뀌고 이 결과는 옛 조건 그대로라, 둘이 다르면 현재 조건으로 다시 받아온다 (체크박스와 목록이 어긋나 보이지 않게).
    const currentConditionText = localStorage.getItem("customhouse:lastDiagnosisCondition");
    const listingConditionText = localStorage.getItem("customhouse:lastListingDiagnosisCondition");
    const isStale = !!raw && !!currentConditionText && currentConditionText !== listingConditionText;

    if (!raw) {
      document.getElementById("empty-state").classList.remove("hidden");
    } else if (isStale) {
      const stateEl = document.getElementById("empty-state");
      stateEl.innerHTML = '<p class="text-gray-500">조건이 바뀌어 추천 매물을 다시 불러오는 중이에요... (최대 1분)</p>';
      stateEl.classList.remove("hidden");
      CustomHouseRecommendationApi.requestListingDiagnosis(JSON.parse(currentConditionText))
        .then((result) => {
          localStorage.setItem("customhouse:lastListingDiagnosis", JSON.stringify(result));
          localStorage.setItem("customhouse:lastListingDiagnosisCondition", currentConditionText);
          location.reload();
        })
        .catch((err) => {
          stateEl.innerHTML = `<p class="text-red-600 mb-4">${esc(err.message || "추천 매물을 불러오지 못했어요.")}</p>
            <a href="input-form.html" class="px-6 py-2 rounded-full text-white brand-gradient">조건 다시 입력하기</a>`;
        });
    } else {
      const data = JSON.parse(raw);
      document.getElementById("result-content").classList.remove("hidden");
      document.getElementById("source-tabbar").classList.remove("hidden");

      // 화면 전체를 꽉 채우는 레이아웃: 헤더/상단 바를 뺀 남는 세로 공간(하단 탭 바 52px 제외)을 3열이 모두 쓴다.
      const TABBAR_H = 52;
      const layoutEl = document.querySelector(".report-layout");
      function fitLayout() {
        if (window.innerWidth <= 1100) {
          layoutEl.style.height = ""; // 좁은 화면은 세로로 쌓고 페이지가 스크롤된다
        } else {
          const top = layoutEl.getBoundingClientRect().top + window.scrollY;
          layoutEl.style.height = Math.max(480, window.innerHeight - top - TABBAR_H) + "px";
        }
        if (window.CustomHouseClusterMapUtil) CustomHouseClusterMapUtil.relayout(); // 지도 크기가 바뀌면 카카오 지도에 알려줘야 한다
      }
      fitLayout();
      window.addEventListener("resize", fitLayout);
      window.addEventListener("load", fitLayout);
      if (window.ResizeObserver) {
        // 헤더(Tailwind CDN 로드 후)와 상단 바 높이가 나중에 바뀌어도 다시 맞춘다
        const ro = new ResizeObserver(fitLayout);
        ro.observe(document.getElementById("app-header"));
        ro.observe(document.querySelector(".report-topbar"));
      }

      const wolseList = data.wolse_recommendations || [];
      const jeonseList = data.jeonse_recommendations || [];
      const allResults = [...wolseList, ...jeonseList];

      const savedCondition = localStorage.getItem("customhouse:lastDiagnosisCondition");
      const condition = savedCondition ? JSON.parse(savedCondition) : null;
      const TRANSPORT_TYPE_LABELS = { CAR: "자동차", WALK: "도보", PUBLIC: "대중교통" };
      const transportLabel = TRANSPORT_TYPE_LABELS[condition?.transportType] || "대중교통";

      // 보증금 한도(희망 보증금, 없으면 현재 보유 보증금)를 넘는 매물은 추천에서 제외된다 - 왜 매물이 적은지 알 수 있게 밝힌다.
      const depositLimitText = data.deposit_limit ? fmtMoney(data.deposit_limit) : "";
      document.getElementById("summary-line").textContent =
        `${depositLimitText ? `보증금 ${depositLimitText} 이하 ` : ""}조건에 맞는 매물 ${(data.total_candidates ?? 0).toLocaleString()}건 중 월세 ${wolseList.length}개, 전세 ${jeonseList.length}개를 추천해요. 각 목록은 보증금전환 실질거주비가 낮은 순입니다.`;
      if (depositLimitText) {
        document.getElementById("wolse-empty").textContent = `보증금 ${depositLimitText} 이하 월세 매물을 찾지 못했어요. 희망 보증금을 올려보세요.`;
        document.getElementById("jeonse-empty").textContent = `보증금 ${depositLimitText} 이하 전세 매물을 찾지 못했어요. 희망 보증금(전세액)을 올려보세요.`;
      }
      document.getElementById("affordable-rent").textContent = `${fmtNum(data.affordable_rent)}만원`;
      document.getElementById("rir").textContent = `${fmtRate(data.rent_to_income_ratio)}%`;

      // 소득 대비 주택임대료 비율(RIR): 수도권 값을 주거비 비율로 보여주고, 소득수준별(하위/중위/상위) 비율마다 내 월소득 x 비율로
      // 따로 계산한 적정 월세를 표로 보여준다 (docs/RIR.csv - 국토교통부 주거실태조사). 통계 파일이 없으면 표는 숨긴다.
      if (data.rir_year) {
        document.getElementById("rir-label").textContent = `수도권 주거비 비율(RIR, ${data.rir_year})`;
        // 적정 월세 상한은 수도권 RIR을 내 월소득에 적용한 값이다 (통계 파일이 없을 때만 소득의 20% 기본값 - 위 HTML 기본 문구)
        const affordLabel = document.getElementById("afford-label");
        affordLabel.innerHTML = `적정 월세 상한 <span class="text-gray-300">(수도권 RIR ${fmtRate(data.rent_to_income_ratio)}% 기준)</span>`;
        affordLabel.title = `내 월소득 x 수도권 RIR(${fmtRate(data.rent_to_income_ratio)}%, ${data.rir_year}년 ${esc(data.rir_source || "")})`;
        const rows = [
          { label: "수도권 평균", grp: "전체 가구", pct: data.rent_to_income_ratio, rent: data.rir_metro_affordable_rent, metro: true },
          ...(data.rir_by_income || []).map((lv) => ({ label: lv.label, grp: "소득수준별", pct: lv.rir_percent, rent: lv.affordable_rent, metro: false })),
        ];
        document.getElementById("rir-table-body").innerHTML = rows
          .map(
            (r) => `<tr class="${r.metro ? "metro" : ""}">
              <td>${esc(r.label)}</td>
              <td class="num">${fmtRate(r.pct)}%</td>
              <td class="num">${Number(r.rent).toFixed(1)}만원</td>
            </tr>`
          )
          .join("");
        document.getElementById("rir-foot").innerHTML =
          `내 월소득 <b>${fmtNum(data.rir_monthly_income)}만원</b>(입력한 연소득 ÷ 12) × RIR로 계산했어요. ` +
          `출처: ${esc(data.rir_source)} ${data.rir_year}년 · RIR = 월임대료 ÷ 월가구소득(중위값, 보증금은 월세로 환산). ` +
          `통계의 월소득은 세금 제외 실수령액 기준이라, 입력하신 연소득이 세전이면 실제 적정 월세는 이보다 낮을 수 있어요.`;
        document.getElementById("rir-box").classList.remove("hidden");
      }
      document.getElementById("disclaimer").textContent = data.disclaimer;

      // 보증금을 월 비용으로 환산하는 이율 = 한국부동산원 수도권 전월세 전환율(종합주택) 최신 월 값. 조회에 실패해 대체값을 썼으면 그렇다고 밝힌다.
      const depositRateText = `${fmtRate(data.deposit_conversion_rate)}%`;
      const rateNote = document.getElementById("rate-note");
      rateNote.innerHTML =
        `💡 보증금 이자는 <b>${esc(data.deposit_conversion_rate_label || "수도권 전월세 전환율")}</b> <b>${depositRateText}</b>로 환산했어요.` +
        (data.deposit_conversion_rate_is_fallback ? ` <span style="color:#b45309">(최신 값을 불러오지 못해 대체값을 썼어요)</span>` : "");
      document.getElementById("jeonse-note").textContent =
        `전세는 월세가 없어서 관리비와 보증금 이자(보증금을 연 ${depositRateText}로 환산)를 더한 "보증금전환 실질거주비"가 낮은 순이에요.`;

      const workAddressEl = document.getElementById("work-address-line");
      if (condition?.workLocation) {
        const addressText = condition.workAddress || `${condition.workLocation} 권역`;
        workAddressEl.textContent = `📍 직장/학교 위치: ${addressText}`;
        workAddressEl.classList.remove("hidden");
      }

      const commuteBadge = document.getElementById("commute-source-badge");
      commuteBadge.textContent = data.used_distance_estimate
        ? `⚠ ${transportLabel} 실제 경로 API 대신 직선거리 추정이 일부 사용됨`
        : `통근시간 ${transportLabel} API 실측 기반`;
      commuteBadge.classList.toggle("estimate", !!data.used_distance_estimate);
      commuteBadge.classList.remove("hidden");

      const workLocationForMap = condition?.workLocation
        ? {
            lat: condition.workLat ?? null,
            lon: condition.workLon ?? null,
            region: condition.workLocation,
            label: condition.workAddress || condition.workLocation,
          }
        : null;

      // 차트는 월세 상위 30건만 (수백 건을 다 그리면 막대가 읽히지 않는다)
      CustomHouseChartUtil.renderSavingsChart("savings-chart", wolseList.slice(0, 30));
      // 지도 마커 인덱스가 우측 목록과 1:1로 맞도록 같은 배열을 넘긴다 (map-util.js와 renderListingCard가 공유하는 idx).
      CustomHouseClusterMapUtil.renderListingsMap(
        "map-container",
        wolseList,
        (idx) => scrollToBuildingCard(idx),
        workLocationForMap
      );

      // ---------- 주택 유형 필터 + 다시 조회 (같은 조건에서 유형만 바꿔 더미 매물 추천을 다시 받는다) ----------
      const ALL_BUILDING_TYPES = ["아파트", "오피스텔", "연립다세대", "단독다가구"];
      const initialTypes = condition?.preferredBuildingTypes?.length ? condition.preferredBuildingTypes : ALL_BUILDING_TYPES;
      const buildingTypeCheckboxes = Array.from(document.querySelectorAll(".building-type-checkbox"));
      buildingTypeCheckboxes.forEach((cb) => (cb.checked = initialTypes.includes(cb.value)));
      const requeryMsg = document.getElementById("requery-msg");

      function setRequeryMsg(text, isError) {
        requeryMsg.textContent = text;
        requeryMsg.classList.toggle("error", !!isError);
      }

      async function requeryByBuildingType() {
        const selectedTypes = buildingTypeCheckboxes.filter((cb) => cb.checked).map((cb) => cb.value);
        if (selectedTypes.length === 0) return setRequeryMsg("주택 유형을 1개 이상 선택해주세요.", true);
        if (!condition) return setRequeryMsg("조건 정보가 없어 다시 조회할 수 없어요. 처음부터 진단해주세요.", true);

        setRequeryMsg("다시 조회 중...", false);
        buildingTypeCheckboxes.forEach((cb) => (cb.disabled = true));
        try {
          const newCondition = { ...condition, preferredBuildingTypes: selectedTypes };
          const result = await CustomHouseRecommendationApi.requestListingDiagnosis(newCondition);
          localStorage.setItem("customhouse:lastListingDiagnosis", JSON.stringify(result));
          localStorage.setItem("customhouse:lastListingDiagnosisCondition", JSON.stringify(newCondition));
          localStorage.setItem("customhouse:lastDiagnosisCondition", JSON.stringify(newCondition));
          localStorage.removeItem("customhouse:lastDiagnosis"); // 조건이 바뀌었으니 예전 실거래가 리포트 결과는 무효
          location.reload();
        } catch (err) {
          setRequeryMsg(err.message || "다시 조회하는 중 오류가 발생했어요.", true);
          buildingTypeCheckboxes.forEach((cb) => (cb.disabled = false));
        }
      }
      buildingTypeCheckboxes.forEach((cb) => cb.addEventListener("change", requeryByBuildingType));

      // ---------- 월세/전세 탭 전환 (우측 목록 + 지도 마커 둘 다 선택한 탭 것만 보여준다) ----------
      document.querySelectorAll(".report-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          const tab = btn.dataset.tab;
          document.querySelectorAll(".report-tab").forEach((b) => b.classList.toggle("active", b === btn));
          document.getElementById("wolse-panel").classList.toggle("hidden", tab !== "wolse");
          document.getElementById("jeonse-panel").classList.toggle("hidden", tab !== "jeonse");
          CustomHouseClusterMapUtil.renderListingsMap(
            "map-container",
            tab === "wolse" ? wolseList : jeonseList,
            (idx) => scrollToBuildingCard(idx),
            workLocationForMap
          );
        });
      });

      // ---------- 하단 탭: 기존 "실거래가 기준 리포트"로 이동 ----------
      // 저장해 둔 같은 조건으로 기존 API(국토부 실거래가 기준)를 호출해 결과를 저장한 뒤 report-result.html을 연다.
      // 콜드 상태에서는 외부 API 때문에 최대 1분가량 걸릴 수 있다.
      const legacyTab = document.getElementById("legacy-report-tab");
      legacyTab.addEventListener("click", async () => {
        if (!condition) {
          alert("조건 정보가 없어 기존 리포트를 불러올 수 없어요. 처음부터 진단해주세요.");
          return;
        }
        legacyTab.disabled = true;
        legacyTab.textContent = "⏳ 실거래가 기준 리포트 불러오는 중... (최대 1분)";
        try {
          const result = await CustomHouseRecommendationApi.requestDiagnosis(condition);
          localStorage.setItem("customhouse:lastDiagnosis", JSON.stringify(result));
          location.href = "report-result.html";
        } catch (err) {
          alert(err.message || "실거래가 기준 리포트를 불러오지 못했어요. 잠시 후 다시 시도해주세요.");
          legacyTab.disabled = false;
          legacyTab.textContent = "📊 실거래가 기준 리포트 (기존)";
        }
      });

      // 매물 카드 1개.
      // 가격 표시: 월세는 "월세/보증금", 전세는 "전세 보증금"을 가장 크게. 관리비는 이 매물의 실제 관리비다.
      // 실거래가는 카드 맨 아래 "실거래 참고"에 이전 실거래 내역처럼 보조로만 보여준다.
      function renderReference(ref) {
        if (!ref) return "";
        const isJeonse = (ref.monthly_rent || 0) === 0;
        const price = isJeonse
          ? `전세 ${fmtMoney(ref.deposit)}`
          : `보증금 ${fmtMoney(ref.deposit)} / 월세 ${ref.monthly_rent}만원`;
        const renewal =
          ref.contract_type === "갱신" && (ref.pre_deposit || ref.pre_monthly_rent)
            ? `<div>종전 계약: 보증금 ${fmtMoney(ref.pre_deposit)} / 월세 ${ref.pre_monthly_rent ?? 0}만원 · 갱신요구권 ${ref.use_rr_right === "Y" ? "사용" : "미사용"}</div>`
            : "";
        return `
          <details class="listing-details">
            <summary>📊 실거래 참고 (국토부 · 이 건물의 최근 계약)</summary>
            <div class="body">
              <div><b>${esc(ref.contract_date)}</b> ${esc(ref.contract_type)} · ${price}</div>
              <div>${ref.area ? `${ref.area}㎡` : ""}${ref.floor ? ` · ${esc(ref.floor)}층` : ""}${ref.contract_term ? ` · 계약기간 ${esc(ref.contract_term)}` : ""}</div>
              ${renewal}
              <div class="text-gray-400 mt-1">국토교통부 실거래가 기준이며, 이 매물의 가격과는 다를 수 있어요.</div>
            </div>
          </details>`;
      }

      function renderBroker(b, listingId) {
        if (!b || !b.name) return "";
        return `
          <details class="listing-details">
            <summary>🏢 공인중개사 · ${esc(b.name)}</summary>
            <div class="body">
              <div>대표 ${esc(b.representative)} · 등록번호 ${esc(b.reg_no)}</div>
              <div>📞 ${esc(b.phone)}</div>
              <div>${esc(b.address)}</div>
              ${b.comment ? `<div class="mt-1">“${esc(b.comment)}”</div>` : ""}
            </div>
          </details>`;
      }

      function renderListingCard(r, idx) {
        const isJeonse = r.lease_type === "전세";
        const hasPhoto = r.photo && r.photo !== PHOTO_PLACEHOLDER;

        const headerRight = isJeonse
          ? `<div class="text-lg font-extrabold whitespace-nowrap" style="color:var(--brand-600)">전세 ${fmtMoney(r.listing_deposit)}</div>`
          : `
              <div class="text-lg font-extrabold whitespace-nowrap" style="color:var(--brand-600)">월세 ${r.listing_monthly_rent}만원</div>
              <div class="text-sm font-bold text-gray-700 mt-0.5 whitespace-nowrap">보증금 ${fmtMoney(r.listing_deposit)}</div>
            `;

        // 실질 주거비 = 월세 + 관리비 (교통비는 뺐다). 보증금전환 실질거주비 = 월세 + 관리비 + 보증금 기회비용(보증금 x 연 전환율% / 12, 전환율=한국부동산원 수도권 전월세 전환율)
        const costBoxes = `
          <div class="cost-boxes">
            <div class="cost-box" title="월세 + 관리비">
              <div class="lbl">실질 주거비</div>
              <div class="val">${fmtNum(r.real_housing_cost)}만원/월</div>
              <div class="sub">월세 + 관리비</div>
            </div>
            <div class="cost-box conv" title="월세 + 관리비 + 보증금 기회비용(보증금 x 연 ${fmtRate(data.deposit_conversion_rate)}% / 12)">
              <div class="lbl">보증금전환 실질거주비</div>
              <div class="val">${fmtNum(r.deposit_converted_cost)}만원/월</div>
              <div class="sub">월세 + 관리비 + 보증금 이자 ${fmtNum(r.deposit_opportunity_cost)}만 (연 ${fmtRate(data.deposit_conversion_rate)}%)</div>
            </div>
          </div>`;

        const facts = [
          r.exclusive_area ? `${r.property_type === "단독다가구" ? "연면적" : "전용"} ${r.exclusive_area}㎡` : "",
          r.unit_label ? esc(r.unit_label) : "",
          r.rooms ? `방 ${r.rooms}·욕실 ${r.bathrooms ?? 1}` : "",
          r.elevator === true ? "엘리베이터" : r.elevator === false ? "엘리베이터 없음" : "",
          r.parking ? `주차 ${esc(r.parking)}` : "",
        ].filter(Boolean).join(" · ");

        const costBreakdown = `
          <div title="${esc(r.maintenance_fee_items || "")}">관리비 ${r.maintenance_fee}만${r.maintenance_fee_items && r.maintenance_fee_items !== "없음" ? " <span class=\"text-gray-400\">(" + esc(r.maintenance_fee_items) + ")</span>" : ""}</div>`;

        return `
        <li class="card p-5" data-idx="${idx}">
          <div class="listing-photo">${hasPhoto ? `<img src="${esc(r.photo)}" alt="${esc(r.building_name)} 내부 사진" loading="lazy" />` : "📷 내부 사진 준비 중"}</div>
          <div class="flex items-start justify-between mb-2">
            <div>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full" style="background:var(--brand-100);color:var(--brand-700)">#${idx + 1}</span>
              <button type="button" class="font-bold ml-2 building-name-link" data-idx="${idx}" title="지도에서 이 매물 위치 보기">${esc(r.building_name)}</button>
              ${r.property_type ? `<span class="text-xs px-2 py-0.5 rounded-full ml-1 bg-gray-100 text-gray-600 whitespace-nowrap inline-block">${esc(r.property_type)}</span>` : ""}
              ${r.is_semi_jeonse ? `<span class="text-xs font-semibold px-2 py-0.5 rounded-full ml-1" style="background:#fef3c7;color:#92400e" title="보증금 ÷ 월세가 100 이상인 반전세형 매물이에요. 보증금이 부담되면 희망 보증금 조건으로 제외할 수 있어요.">반전세형</span>` : ""}
              <span class="text-xs text-gray-400 ml-1" title="${esc(r.commute_source || "카카오 API")}">통근 약 ${r.commute_minutes}분</span>
            </div>
            <div class="text-right">${headerRight}</div>
          </div>
          <div class="text-sm text-gray-700 font-semibold mb-1 flex items-center gap-1">
            <span aria-hidden="true">📍</span>
            <span>${esc(r.address || `서울특별시 ${r.region}${r.dong ? ` ${r.dong}` : ""}`)}</span>
          </div>
          ${facts ? `<div class="text-xs text-gray-500 mb-1">${facts}</div>` : ""}
          ${r.move_in_date ? `<div class="text-xs text-gray-400 mb-1">이사가능일 ${esc(r.move_in_date)}</div>` : ""}
          <div class="text-xs text-gray-500 mt-2">${costBreakdown}</div>
          ${costBoxes}
          ${r.description ? `<details class="listing-details"><summary>📝 상세 설명</summary><div class="body">${esc(r.description)}</div></details>` : ""}
          ${renderBroker(r.broker, r.listing_id)}
          ${renderReference(r.reference_transaction)}
          <div class="listing-no">매물번호 ${esc(r.listing_id)}</div>
        </li>`;
      }

      function renderPolicyTable(recommendations) {
        const uniquePolicies = new Map();
        recommendations.forEach((r) => {
          (r.matched_policies || []).forEach((p) => {
            if (!uniquePolicies.has(p.id)) uniquePolicies.set(p.id, p);
          });
        });
        document.getElementById("policy-table-body").innerHTML = Array.from(uniquePolicies.values())
          .map((p) => `
              <tr class="border-t border-gray-100">
                <td class="px-2 py-2 text-gray-500 align-middle">${esc(p.agency)}</td>
                <td class="px-2 py-2 font-semibold align-middle">${esc(p.name)}</td>
                <td class="px-2 py-2 text-gray-600 align-middle">${esc(p.description)}</td>
              </tr>`)
          .join("");
        document.getElementById("policy-empty").classList.toggle("hidden", uniquePolicies.size > 0);
      }

      const wolseListEl = document.getElementById("wolse-list");
      const jeonseListEl = document.getElementById("jeonse-list");
      const wolseBoxEl = document.getElementById("wolse-box");
      const jeonseBoxEl = document.getElementById("jeonse-box");

      // 목록은 스크롤로 10건씩 이어서 그린다 (한 번에 다 그리면 페이지가 너무 길어진다).
      const LIST_PAGE_SIZE = 10;

      function renderInfiniteList(boxEl, listEl, items) {
        let rendered = 0;
        function loadMore() {
          if (rendered >= items.length) return;
          const batch = items.slice(rendered, rendered + LIST_PAGE_SIZE);
          listEl.insertAdjacentHTML("beforeend", batch.map((r, i) => renderListingCard(r, rendered + i)).join(""));
          rendered += batch.length;
        }
        function loadAll() {
          while (rendered < items.length) loadMore();
        }
        loadMore();
        boxEl.addEventListener("scroll", () => {
          if (boxEl.scrollTop + boxEl.clientHeight >= boxEl.scrollHeight - 100) loadMore();
        });
        return { loadAll };
      }

      const wolseListController = renderInfiniteList(wolseBoxEl, wolseListEl, wolseList);
      const jeonseListController = renderInfiniteList(jeonseBoxEl, jeonseListEl, jeonseList);
      renderPolicyTable(allResults);

      document.getElementById("wolse-empty").classList.toggle("hidden", wolseList.length > 0);
      document.getElementById("jeonse-empty").classList.toggle("hidden", jeonseList.length > 0);

      // ---------- 지도 핀 클릭 -> 우측 목록에서 해당 매물 카드로 이동 ----------
      function scrollToBuildingCard(idx) {
        const isWolseTab = !document.getElementById("wolse-panel").classList.contains("hidden");
        const controller = isWolseTab ? wolseListController : jeonseListController;
        const listEl = isWolseTab ? wolseListEl : jeonseListEl;
        const boxEl = isWolseTab ? wolseBoxEl : jeonseBoxEl;

        controller.loadAll(); // 목표 카드가 아직 스크롤로 안 불러와진 상태일 수 있어 전부 렌더링한다.

        const card = listEl.querySelector(`li[data-idx="${idx}"]`);
        if (!card) return;
        boxEl.scrollTo({ top: card.offsetTop - boxEl.offsetTop - 12, behavior: "smooth" });
        card.classList.add("card-flash");
        setTimeout(() => card.classList.remove("card-flash"), 1200);
      }

      function handleBuildingNameClick(e) {
        const link = e.target.closest(".building-name-link");
        if (link) CustomHouseClusterMapUtil.focusListing(Number(link.dataset.idx));
      }
      wolseListEl.addEventListener("click", handleBuildingNameClick);
      jeonseListEl.addEventListener("click", handleBuildingNameClick);
    }
  </script>
</body>
</html>
