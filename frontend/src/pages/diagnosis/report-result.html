<!DOCTYPE html>
<!-- [담당: 양혜승] AI 주거비 절약 진단 - 결과 리포트 페이지 (핵심 기능 화면)
     레이아웃(2026-09-27): 부동산 플랫폼(직방 등)의 "가운데 큰 지도 + 좌우 패널" 구조를 참고해
     좌측 2단(진단 리포트/정책 추천) · 가운데 큰 지도 · 우측 탭(월세/전세) 3열 레이아웃으로 재구성. -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맞집 | 진단 결과 리포트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/main.css?v=20260915b" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="../../js/config.js?v=20260915c"></script>
  <script>
    // config.js에 카카오맵 키가 있으면 SDK를 끼워넣는다 (autoload=false로 즉시 렌더 방지).
    // document.write는 크롬이 느린 연결에서 차단시키는 인터벤션 대상이라 appendChild로 넣는다.
    if (window.CUSTOMHOUSE_CONFIG && window.CUSTOMHOUSE_CONFIG.KAKAO_MAP_APP_KEY) {
      const kakaoSdkScript = document.createElement("script");
      kakaoSdkScript.src =
        "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" +
        window.CUSTOMHOUSE_CONFIG.KAKAO_MAP_APP_KEY +
        "&autoload=false";
      document.head.appendChild(kakaoSdkScript);
    }
  </script>

  <style>
    /* 좌(진단 리포트/정책 추천 2단) · 중(큰 지도) · 우(월세/전세 탭) 3열 레이아웃 */
    .report-layout {
      display: grid;
      grid-template-columns: 320px 1fr 380px;
      gap: 20px;
      height: 760px;
    }

    .report-col {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .report-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .report-map-card { height: 100%; overflow: hidden; }
    #map-container { height: 100%; }

    .report-tabs {
      display: flex;
      flex: none;
      border-bottom: 1px solid #edf1f5;
    }

    .report-tab {
      flex: 1;
      padding: 14px 0;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      color: #94a3b8;
      border-bottom: 2px solid transparent;
    }

    .report-tab.active {
      color: var(--brand-600, #1B2A4A);
      border-bottom-color: var(--brand-600, #1B2A4A);
    }

    .report-tab-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .report-list-box {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    @media (max-width: 1100px) {
      .report-layout { grid-template-columns: 1fr; height: auto; }
      .report-col { height: auto; }
      .report-map-card { height: 420px; }
      .report-panel { max-height: 480px; }
      .report-list-box { max-height: 480px; }
    }

    /* 주택 유형 필터 - 체크박스 대신 필(pill) 토글 칩으로. 선택됨=네이비로 진하게, 선택 안 됨=흐린 회색. */
    .building-type-filter {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .building-type-filter-label {
      font-size: 16px;
      font-weight: 800;
      color: #334155;
      flex: none;
    }

    .type-chip {
      position: relative;
      display: inline-flex;
      cursor: pointer;
    }

    .type-chip input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .type-chip span {
      display: inline-flex;
      align-items: center;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1.5px solid #e2e8f0;
      background: #f8fafc;
      color: #94a3b8;
      font-size: 16px;
      font-weight: 700;
      transition: background-color .15s, border-color .15s, color .15s;
      user-select: none;
    }

    .type-chip:hover span { border-color: #cbd5e1; color: #64748b; }

    .type-chip input:checked + span {
      background: var(--brand-600, #1B2A4A);
      border-color: var(--brand-600, #1B2A4A);
      color: #fff;
    }

    .type-chip input:focus-visible + span {
      outline: 2px solid var(--brand-600, #1B2A4A);
      outline-offset: 2px;
    }

    .requery-msg {
      font-size: 14px;
      color: #94a3b8;
      width: 100%;
    }

    .requery-msg.error { color: #dc2626; font-weight: 700; }

    /* 매물 카드의 건물명 - 클릭하면 지도에서 해당 지역 핀으로 이동한다 */
    .building-name-link {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      text-decoration-color: #cbd5e1;
    }
    .building-name-link:hover { color: var(--brand-600, #1B2A4A); }

    /* 지도 핀을 클릭해 목록으로 이동했을 때 어떤 카드인지 잠깐 강조 표시 */
    @keyframes card-flash-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(27, 42, 74, 0); }
      25% { box-shadow: 0 0 0 3px rgba(27, 42, 74, 0.35); }
    }
    .card-flash { animation: card-flash-pulse 1.1s ease; }

    /* 통근시간 산출 방식 표시 - 카카오 API 실측인지, API가 막혀 비상용 직선거리 추정을 썼는지
       화면 오른쪽 아래에 작게 알려준다 (2026-09-28, used_distance_estimate 참고). */
    #commute-source-badge {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 40;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #e2e8f0;
      color: #94a3b8;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }
    #commute-source-badge.estimate {
      color: #b45309;
      border-color: #fde68a;
      background: #fffbeb;
    }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main class="max-w-[1440px] mx-auto px-4 py-8">
    <div id="empty-state" class="hidden text-center py-24">
      <p class="text-gray-500 mb-4">진단 결과가 없어요. 먼저 조건을 입력해주세요.</p>
      <a href="input-form.html" class="px-6 py-2 rounded-full text-white brand-gradient">진단하러 가기</a>
    </div>

    <div id="commute-source-badge" class="hidden"></div>

    <div id="result-content" class="hidden">
      <h1 class="text-2xl font-extrabold mb-1">진단 결과 리포트</h1>
      <p class="text-sm font-semibold mb-1 hidden" id="work-address-line" style="color:var(--brand-600)"></p>
      <p class="text-sm text-gray-500 mb-5" id="summary-line"></p>

      <div class="card p-4 mb-5 building-type-filter">
        <span class="building-type-filter-label">주택 유형</span>
        <label class="type-chip">
          <input type="checkbox" class="building-type-checkbox" value="아파트" />
          <span>아파트</span>
        </label>
        <label class="type-chip">
          <input type="checkbox" class="building-type-checkbox" value="오피스텔" />
          <span>오피스텔</span>
        </label>
        <label class="type-chip">
          <input type="checkbox" class="building-type-checkbox" value="연립다세대" />
          <span>연립·다세대</span>
        </label>
        <label class="type-chip">
          <input type="checkbox" class="building-type-checkbox" value="단독다가구" />
          <span>단독·다가구</span>
        </label>
        <span id="requery-msg" class="requery-msg"></span>
      </div>

      <div class="report-layout">
        <!-- 좌: 주거진단 리포트 + 주거정책 추천 (1열 2행) -->
        <div class="report-col">
          <div class="card p-5 report-panel">
            <h2 class="font-bold mb-3">주거진단 리포트</h2>
            <div class="grid grid-cols-2 gap-3 mb-4">
              <div>
                <div class="text-xs text-gray-400 mb-1">적정 월세 상한</div>
                <div class="text-lg font-bold" id="affordable-rent">-</div>
              </div>
              <div>
                <div class="text-xs text-gray-400 mb-1">주거비 비율(RIR)</div>
                <div class="text-lg font-bold" id="rir">-</div>
              </div>
            </div>
            <div style="height: 220px; flex: none">
              <canvas id="savings-chart"></canvas>
            </div>
            <p class="text-xs text-gray-400 mt-3" id="disclaimer"></p>
          </div>

          <div class="card p-5 report-panel">
            <h2 class="font-bold mb-1">주거정책 추천</h2>
            <p class="text-xs text-gray-400 mb-3">매물 추천에 반영된 정책들이에요.</p>
            <div class="overflow-x-auto">
              <table class="w-full text-sm" style="table-layout: fixed">
                <thead class="bg-gray-50">
                  <tr>
                    <th class="text-left px-3 py-2 text-xs font-semibold text-gray-500" style="width: 30%">기관명</th>
                    <th class="text-left px-3 py-2 text-xs font-semibold text-gray-500" style="width: 35%">지원정책명</th>
                    <th class="text-left px-3 py-2 text-xs font-semibold text-gray-500">지원혜택</th>
                  </tr>
                </thead>
                <tbody id="policy-table-body"></tbody>
              </table>
            </div>
            <p id="policy-empty" class="text-sm text-gray-400 hidden mt-2">매칭된 지원 정책이 없어요.</p>
          </div>
        </div>

        <!-- 중: 추천 지역 지도 (크게) -->
        <div class="report-col">
          <div class="card p-0 report-map-card">
            <div id="map-container"></div>
          </div>
        </div>

        <!-- 우: 월세/전세 탭 -->
        <div class="report-col">
          <div class="card p-0 report-panel" style="overflow: hidden">
            <div class="report-tabs">
              <button type="button" class="report-tab active" data-tab="wolse">월세 매물</button>
              <button type="button" class="report-tab" data-tab="jeonse">전세 매물</button>
            </div>

            <div id="wolse-panel" class="report-tab-panel">
              <div id="wolse-box" class="report-list-box p-4">
                <ul id="wolse-list" class="space-y-3"></ul>
                <p id="wolse-empty" class="text-sm text-gray-400 hidden">조건에 맞는 월세 매물을 찾지 못했어요.</p>
              </div>
            </div>

            <div id="jeonse-panel" class="report-tab-panel hidden">
              <p class="text-xs text-gray-400 px-4 pt-3">전세는 월세가 없는 대신, 부족한 보증금을 대출로 채웠을 때의 이자 부담 중심으로 비교해요.</p>
              <div id="jeonse-box" class="report-list-box p-4">
                <ul id="jeonse-list" class="space-y-3"></ul>
                <p id="jeonse-empty" class="text-sm text-gray-400 hidden">조건에 맞는 전세 매물을 찾지 못했어요.</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-8 text-center">
        <a href="input-form.html" class="text-sm underline text-gray-500">조건 다시 입력하기</a>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="../../js/components/header.js?v=20260915b"></script>
  <script src="../../js/components/footer.js?v=20260915b"></script>
  <script src="../../js/api/recommendation.js?v=20260927a"></script>
  <script src="../../js/utils/chart-util.js?v=20260915d"></script>
  <script src="../../js/utils/map-util.js?v=20260915d"></script>
  <script>
    renderHeader("diagnosis");
    renderFooter();

    // localStorage 사용 이유: 진단 후 새 탭에서 리포트를 열거나, 앱을 재시작해 세션이 끊겨도
    // "주택 유형 변경 시 같은 조건으로 재조회"가 계속 동작해야 해서 sessionStorage 대신 쓴다
    // (2026-09-27: sessionStorage는 tab 단위로 격리되어 있어 "조건 정보가 없다" 오류가 반복됐음).
    const raw = localStorage.getItem("customhouse:lastDiagnosis");

    if (!raw) {
      document.getElementById("empty-state").classList.remove("hidden");
    } else {
      const data = JSON.parse(raw);
      document.getElementById("result-content").classList.remove("hidden");

      const wolseList = data.wolse_recommendations || [];
      const jeonseList = data.jeonse_recommendations || [];
      const allResults = [...wolseList, ...jeonseList];

      // 조건(직장 위치·이동수단)을 먼저 읽어와야 상단 주소 표시/배지 문구/지도 기준점에 반영할 수 있다.
      // 입력 폼(input-form.html)에서 저장해둔 원래 조건은 "다시 조회"(주택 유형만 바꿔 재요청)에도 쓴다.
      const savedCondition = localStorage.getItem("customhouse:lastDiagnosisCondition");
      const condition = savedCondition ? JSON.parse(savedCondition) : null;
      const TRANSPORT_TYPE_LABELS = { CAR: "자동차", WALK: "도보", PUBLIC: "대중교통" };
      const transportLabel = TRANSPORT_TYPE_LABELS[condition?.transportType] || "대중교통";

      document.getElementById("summary-line").textContent =
        `월세 ${wolseList.length}개, 전세 ${jeonseList.length}개 매물을 분석했어요. 각 목록은 실질 주거비가 낮은 순입니다.`;
      document.getElementById("affordable-rent").textContent = `${data.affordable_rent}만원`;
      document.getElementById("rir").textContent = `${data.rent_to_income_ratio}%`;
      document.getElementById("disclaimer").textContent = data.disclaimer;

      // 지금 반영된 직장/학교 위치를 상단에 바로 보이게 표시 - "어떤 주소 기준으로 이 결과가
      // 나왔는지" 헷갈리지 않게 한다.
      const workAddressEl = document.getElementById("work-address-line");
      if (condition?.workLocation) {
        const addressText = condition.workAddress || `${condition.workLocation} 권역`;
        workAddressEl.textContent = `📍 직장/학교 위치: ${addressText}`;
        workAddressEl.classList.remove("hidden");
      }

      // 통근시간이 카카오 API 실측인지, API가 막혀 비상용 직선거리 추정을 썼는지, 그리고 어떤
      // 이동수단이 대체됐는지 화면 오른쪽 아래에 작게 표시한다 (used_distance_estimate,
      // calculator.py의 ESTIMATE_SOURCE_LABEL 참고 - "일부"라고만 뭉뚱그리지 않고 이동수단을 밝힌다).
      const commuteBadge = document.getElementById("commute-source-badge");
      commuteBadge.textContent = data.used_distance_estimate
        ? `⚠ ${transportLabel} 실제 경로 API 대신 직선거리 추정이 일부 사용됨`
        : `통근시간 ${transportLabel} API 실측 기반`;
      commuteBadge.classList.toggle("estimate", !!data.used_distance_estimate);
      commuteBadge.classList.remove("hidden");

      // 지도에 직장/학교 위치를 눈에 띄는 기준점 핀으로 같이 찍는다 (정확한 좌표가 있으면 그
      // 좌표, 없으면(드롭다운으로만 선택한 경우) map-util.js가 지역 대표좌표로 대체한다).
      const workLocationForMap = condition?.workLocation
        ? {
            lat: condition.workLat ?? null,
            lon: condition.workLon ?? null,
            region: condition.workLocation,
            label: condition.workAddress || condition.workLocation,
          }
        : null;

      CustomHouseChartUtil.renderSavingsChart("savings-chart", wolseList);
      // 처음엔 "월세 매물" 탭이 활성 상태이므로, 지도 마커의 인덱스가 우측 목록(wolseList)과
      // 1:1로 맞도록 wolseList를 넘긴다 (매물마다 좌표가 달라 지역 단위가 아니라 인덱스로 맞춰야 함).
      CustomHouseMapUtil.renderRecommendedRegionsMap(
        "map-container",
        wolseList,
        (idx) => scrollToBuildingCard(idx),
        workLocationForMap
      );

      // ---------- 주택 유형 필터 + 다시 조회 ----------
      const ALL_BUILDING_TYPES = ["아파트", "오피스텔", "연립다세대", "단독다가구"];
      const initialTypes = condition?.preferredBuildingTypes?.length
        ? condition.preferredBuildingTypes
        : ALL_BUILDING_TYPES;

      document.querySelectorAll(".building-type-checkbox").forEach((cb) => {
        cb.checked = initialTypes.includes(cb.value);
      });

      const buildingTypeCheckboxes = Array.from(document.querySelectorAll(".building-type-checkbox"));
      const requeryMsg = document.getElementById("requery-msg");

      function setRequeryMsg(text, isError) {
        requeryMsg.textContent = text;
        requeryMsg.classList.toggle("error", !!isError);
      }

      // 체크박스를 켜고 끄는 즉시(별도 버튼 없이) 같은 조건에서 주택 유형만 바꿔 자동으로 다시 조회한다.
      async function requeryByBuildingType() {
        const selectedTypes = buildingTypeCheckboxes.filter((cb) => cb.checked).map((cb) => cb.value);

        if (selectedTypes.length === 0) {
          setRequeryMsg("주택 유형을 1개 이상 선택해주세요.", true);
          return;
        }
        if (!condition) {
          setRequeryMsg("조건 정보가 없어 다시 조회할 수 없어요. 처음부터 진단해주세요.", true);
          return;
        }

        setRequeryMsg("다시 조회 중...", false);
        buildingTypeCheckboxes.forEach((cb) => (cb.disabled = true));

        try {
          const newCondition = { ...condition, preferredBuildingTypes: selectedTypes };
          const result = await CustomHouseRecommendationApi.requestDiagnosis(newCondition);
          localStorage.setItem("customhouse:lastDiagnosis", JSON.stringify(result));
          localStorage.setItem("customhouse:lastDiagnosisCondition", JSON.stringify(newCondition));
          location.reload();
        } catch (err) {
          setRequeryMsg(err.message || "다시 조회하는 중 오류가 발생했어요.", true);
          buildingTypeCheckboxes.forEach((cb) => (cb.disabled = false));
        }
      }

      buildingTypeCheckboxes.forEach((cb) => {
        cb.addEventListener("change", requeryByBuildingType);
      });

      // ---------- 월세/전세 탭 전환 (우측 목록 + 지도 마커 둘 다 선택한 탭 것만 보여준다) ----------
      document.querySelectorAll(".report-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          const tab = btn.dataset.tab;
          document.querySelectorAll(".report-tab").forEach((b) => b.classList.toggle("active", b === btn));
          document.getElementById("wolse-panel").classList.toggle("hidden", tab !== "wolse");
          document.getElementById("jeonse-panel").classList.toggle("hidden", tab !== "jeonse");
          CustomHouseMapUtil.renderRecommendedRegionsMap(
            "map-container",
            tab === "wolse" ? wolseList : jeonseList,
            (idx) => scrollToBuildingCard(idx),
            workLocationForMap
          );
        });
      });

      // 매물 카드 1개를 렌더링한다.
      // 2026-09-28: 월세는 보증금 조정(전월세전환율/대출금리 가정) 계산을 없앴다 - 정확한 금리를
      // 알 수 없는 불확실한 가정으로 실거래 원본을 왜곡하지 않기 위해서다. 그래서 월세 카드는
      // "실거래 월세"와 "실거래 보증금"을 헤더에 바로 위아래로 붙여서 가장 먼저 눈에 띄게 하고,
      // 관리비·교통비를 더한 실질 주거비는 부가 정보로만 작게 보여준다. 전세는 보증금이 곧 비용의
      // 핵심이라, 희망 보증금보다 비싼 부분만 대출이자로 환산해 실질 주거비에 더한다(절감액 비교는 없다).
      function renderBuildingCard(r, idx) {
        const isJeonse = r.lease_type === "전세";

        const headerRight = isJeonse
          ? `
              <div class="text-lg font-extrabold" style="color:var(--brand-600)">${r.listing_deposit}만원</div>
              <div class="text-xs font-bold" style="color:#94a3b8">전세보증금 (실거래 원본)</div>
              <div class="text-xs text-gray-400 mt-1">대출이자·관리비·교통비 포함 실질 주거비 ${r.real_housing_cost}만원/월</div>
            `
          : `
              <div class="text-lg font-extrabold" style="color:var(--brand-600)">${r.listing_monthly_rent}만원/월</div>
              <div class="text-sm font-bold text-gray-700 mt-0.5">보증금 ${r.listing_deposit}만원</div>
              <div class="text-xs text-gray-400 mt-1">실거래 원본 · 관리비·교통비 포함 ${r.real_housing_cost}만원</div>
            `;

        const costBreakdown = isJeonse
          ? `
              <div>관리비 ${r.maintenance_fee}만</div>
              <div>대출이자 ${r.loan_interest}만</div>
              <div>교통비 ${r.transportation_cost}만</div>
            `
          : `
              <div>관리비 ${r.maintenance_fee}만</div>
              <div>교통비 ${r.transportation_cost}만</div>
            `;

        return `
        <li class="card p-5" data-idx="${idx}">
          <div class="flex items-start justify-between mb-2">
            <div>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full" style="background:var(--brand-100);color:var(--brand-700)">#${
                idx + 1
              }</span>
              <button type="button" class="font-bold ml-2 building-name-link" data-idx="${idx}" title="지도에서 이 매물 위치 보기">${r.building_name}</button>
              ${
                r.property_type
                  ? `<span class="text-xs px-2 py-0.5 rounded-full ml-1 bg-gray-100 text-gray-600 whitespace-nowrap inline-block">${r.property_type}</span>`
                  : ""
              }
              ${
                r.is_semi_jeonse
                  ? `<span class="text-xs font-semibold px-2 py-0.5 rounded-full ml-1" style="background:#fef3c7;color:#92400e" title="보증금을 크게 걸고 월세는 소액만 내는 매물이에요. 보증금이 부담되면 아래 '희망 보증금' 필터로 제외할 수 있어요.">반전세형</span>`
                  : ""
              }
              <span class="text-xs text-gray-400 ml-1" title="${r.commute_source || "카카오 API"}">통근 약 ${r.commute_minutes}분</span>
            </div>
            <div class="text-right">
              ${headerRight}
            </div>
          </div>
          <div class="text-sm text-gray-700 font-semibold mb-1 flex items-center gap-1">
            <span aria-hidden="true">📍</span>
            <span>${r.address || `서울특별시 ${r.region}${r.dong ? ` ${r.dong}` : ""}`}</span>
          </div>
          <div class="text-xs text-gray-400 mb-1">
            ${
          r.exclusive_area ? `${r.property_type === "단독다가구" ? "연면적" : "전용"} ${r.exclusive_area}㎡ · ` : ""
        }${r.floor ? `${r.floor}층 · ` : ""}${r.data_source}
          </div>
          <div class="grid ${isJeonse ? "grid-cols-3" : "grid-cols-2"} gap-2 text-xs text-gray-500 mt-2">
            ${costBreakdown}
          </div>
        </li>
      `;
      }

      // 매물 카드에 개별로 붙이던 정책 배지를 없애고, 월세/전세 매물 전체에서 매칭된 정책을
      // 하나로 모아 "주거정책 추천" 표(기관명/지원정책명/지원혜택)로 독립시킨다.
      function renderPolicyTable(recommendations) {
        const uniquePolicies = new Map();
        recommendations.forEach((r) => {
          (r.matched_policies || []).forEach((p) => {
            if (!uniquePolicies.has(p.id)) uniquePolicies.set(p.id, p);
          });
        });

        const policyTableBody = document.getElementById("policy-table-body");
        policyTableBody.innerHTML = Array.from(uniquePolicies.values())
          .map(
            (p) => `
              <tr class="border-t border-gray-100">
                <td class="px-3 py-2 text-gray-500">${p.agency}</td>
                <td class="px-3 py-2 font-semibold">${p.name}</td>
                <td class="px-3 py-2 text-gray-600">${p.description}</td>
              </tr>
            `
          )
          .join("");

        document.getElementById("policy-empty").classList.toggle("hidden", uniquePolicies.size > 0);
      }

      const wolseListEl = document.getElementById("wolse-list");
      const jeonseListEl = document.getElementById("jeonse-list");
      const wolseBoxEl = document.getElementById("wolse-box");
      const jeonseBoxEl = document.getElementById("jeonse-box");

      // 박스 안 목록을 스크롤로 계속 불러온다 - 매물(최대 500건)은 이 목록에 전부 들어있고,
      // 지도에는 (매물 좌표 데이터가 없어) 지역당 마커 1개로 요약해서 보여준다. 한 번에 다 그리면
      // 페이지가 너무 길어지니 스크롤 시 다음 묶음만 추가로 그린다.
      const LIST_PAGE_SIZE = 10;

      function renderInfiniteList(boxEl, listEl, items) {
        let rendered = 0;

        function loadMore() {
          if (rendered >= items.length) return;
          const batch = items.slice(rendered, rendered + LIST_PAGE_SIZE);
          listEl.insertAdjacentHTML("beforeend", batch.map((r, i) => renderBuildingCard(r, rendered + i)).join(""));
          rendered += batch.length;
        }

        function loadAll() {
          while (rendered < items.length) loadMore();
        }

        loadMore();
        boxEl.addEventListener("scroll", () => {
          if (boxEl.scrollTop + boxEl.clientHeight >= boxEl.scrollHeight - 100) loadMore();
        });

        return { loadAll };
      }

      const wolseListController = renderInfiniteList(wolseBoxEl, wolseListEl, wolseList);
      const jeonseListController = renderInfiniteList(jeonseBoxEl, jeonseListEl, jeonseList);
      renderPolicyTable(allResults);

      document.getElementById("wolse-empty").classList.toggle("hidden", wolseList.length > 0);
      document.getElementById("jeonse-empty").classList.toggle("hidden", jeonseList.length > 0);

      // ---------- 지도 핀 클릭 -> 우측 목록에서 해당 매물 카드로 이동 ----------
      // idx는 map-util.js에 넘긴 배열(wolseList/jeonseList)과 카드 렌더링(renderBuildingCard)이
      // 공유하는 같은 인덱스라 탭이 바뀌어도 항상 정확히 같은 매물을 가리킨다.
      function scrollToBuildingCard(idx) {
        const isWolseTab = !document.getElementById("wolse-panel").classList.contains("hidden");
        const controller = isWolseTab ? wolseListController : jeonseListController;
        const listEl = isWolseTab ? wolseListEl : jeonseListEl;
        const boxEl = isWolseTab ? wolseBoxEl : jeonseBoxEl;

        controller.loadAll(); // 목표 카드가 아직 스크롤로 안 불러와진 상태일 수 있어 전부 렌더링한다.

        const card = listEl.querySelector(`li[data-idx="${idx}"]`);
        if (!card) return;

        boxEl.scrollTo({ top: card.offsetTop - boxEl.offsetTop - 12, behavior: "smooth" });
        card.classList.add("card-flash");
        setTimeout(() => card.classList.remove("card-flash"), 1200);
      }

      // ---------- 매물 카드의 건물명 클릭 -> 지도에서 해당 매물(좌표 없으면 지역 대표) 핀으로 이동 ----------
      function handleBuildingNameClick(e) {
        const link = e.target.closest(".building-name-link");
        if (link) CustomHouseMapUtil.focusBuilding(Number(link.dataset.idx));
      }
      wolseListEl.addEventListener("click", handleBuildingNameClick);
      jeonseListEl.addEventListener("click", handleBuildingNameClick);
    }
  </script>
</body>
</html>
