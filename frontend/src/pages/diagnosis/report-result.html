<!DOCTYPE html>
<!-- [담당: 양혜승] AI 주거비 절약 진단 - 결과 리포트 페이지 (핵심 기능 화면) -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맞집 | 진단 결과 리포트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/main.css?v=20260915b" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <div id="app-header"></div>

  <main class="max-w-3xl mx-auto px-4 py-12">
    <div id="empty-state" class="hidden text-center py-24">
      <p class="text-gray-500 mb-4">진단 결과가 없어요. 먼저 조건을 입력해주세요.</p>
      <a href="input-form.html" class="px-6 py-2 rounded-full text-white brand-gradient">진단하러 가기</a>
    </div>

    <div id="result-content" class="hidden">
      <h1 class="text-2xl font-extrabold mb-2">진단 결과 리포트</h1>
      <p class="text-sm text-gray-500 mb-6" id="summary-line"></p>

      <div class="grid grid-cols-2 gap-4 mb-8">
        <div class="card p-5">
          <div class="text-xs text-gray-400 mb-1">소득 기준 적정 월세 상한</div>
          <div class="text-xl font-bold" id="affordable-rent">-</div>
        </div>
        <div class="card p-5">
          <div class="text-xs text-gray-400 mb-1">소득 대비 주거비 비율(RIR)</div>
          <div class="text-xl font-bold" id="rir">-</div>
        </div>
      </div>

      <div class="card p-5 mb-8" style="height: 300px">
        <canvas id="savings-chart"></canvas>
      </div>

      <h2 class="font-bold mb-3">추천 지역 (통근 · 정책까지 반영한 실질 주거비 순)</h2>
      <div id="map-container" class="mb-6"></div>

      <ul id="recommendation-list" class="space-y-3"></ul>

      <p class="text-xs text-gray-400 mt-8" id="disclaimer"></p>

      <div class="mt-8 text-center">
        <a href="input-form.html" class="text-sm underline text-gray-500">조건 다시 입력하기</a>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="../../js/components/header.js?v=20260915b"></script>
  <script src="../../js/components/footer.js?v=20260915b"></script>
  <script src="../../js/utils/chart-util.js?v=20260915b"></script>
  <script src="../../js/utils/map-util.js?v=20260915b"></script>
  <script>
    renderHeader("diagnosis");
    renderFooter();

    const raw = sessionStorage.getItem("customhouse:lastDiagnosis");

    if (!raw) {
      document.getElementById("empty-state").classList.remove("hidden");
    } else {
      const data = JSON.parse(raw);
      document.getElementById("result-content").classList.remove("hidden");

      document.getElementById("summary-line").textContent =
        `${data.recommendations.length}개 지역을 분석했어요. 아래 순서는 실질 주거비가 낮은 순입니다.`;
      document.getElementById("affordable-rent").textContent = `${data.affordable_rent}만원`;
      document.getElementById("rir").textContent = `${data.rent_to_income_ratio}%`;
      document.getElementById("disclaimer").textContent = data.disclaimer;

      CustomHouseChartUtil.renderSavingsChart("savings-chart", data.recommendations);
      CustomHouseMapUtil.renderRecommendedRegionsMap("map-container", data.recommendations);

      const list = document.getElementById("recommendation-list");
      list.innerHTML = data.recommendations
        .map(
          (r, idx) => `
        <li class="card p-5">
          <div class="flex items-start justify-between mb-2">
            <div>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full" style="background:var(--brand-100);color:var(--brand-700)">#${
                idx + 1
              }</span>
              <span class="font-bold ml-2">${r.region}</span>
              <span class="text-xs text-gray-400 ml-1">통근 약 ${r.commute_minutes}분</span>
            </div>
            <div class="text-right">
              <div class="text-lg font-extrabold" style="color:var(--brand-600)">${r.real_housing_cost}만원/월</div>
              <div class="text-xs text-gray-400">월 ${r.monthly_savings}만원 절감</div>
            </div>
          </div>
          <div class="grid grid-cols-4 gap-2 text-xs text-gray-500 mb-3">
            <div>월세 ${r.rent}만</div>
            <div>관리비 ${r.maintenance_fee}만</div>
            <div>대출이자 ${r.loan_interest}만</div>
            <div>교통비 ${r.transportation_cost}만</div>
          </div>
          ${
            r.matched_policies.length
              ? `<div class="flex flex-wrap gap-2">
                  ${r.matched_policies
                    .map(
                      (p) =>
                        `<span class="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-600" title="${p.description}">✅ ${p.name}</span>`
                    )
                    .join("")}
                </div>`
              : `<div class="text-xs text-gray-400">매칭된 지원 정책 없음</div>`
          }
        </li>
      `
        )
        .join("");
    }
  </script>
</body>
</html>
