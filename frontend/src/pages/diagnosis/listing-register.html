<!DOCTYPE html>
<!-- [담당: 송귀성] 매물 등록 - 전용 페이지 (2026-10-01, 기존 report-listings.html의 작은 팝업을 대체)
     더미 매물(docs/samples/dummyhouses)과 카드에서 이질감이 없도록, 더미 매물이 가진 속성을 전부
     입력받는다. 주소는 다음 우편번호 검색 + 카카오 지오코딩으로 확정하고, 지도에 핀을 찍어 확인시킨다.
     사진은 대표 1장만 업로드(ListingPhotoController)한다. -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맞집 | 매물 등록</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/main.css?v=20260915b" />
  <script src="../../js/config.js?v=20260915d"></script>
  <script>
    // 주소 검색(카카오 지오코딩)용 SDK. 키 없으면 안 불러오고, 아래 스크립트가 주소 입력만 받고
    // 핀 확인 단계는 건너뛴다(input-form.html의 직장 위치 검색과 같은 패턴).
    if (window.CUSTOMHOUSE_CONFIG && window.CUSTOMHOUSE_CONFIG.KAKAO_MAP_APP_KEY) {
      const kakaoSdkScript = document.createElement("script");
      kakaoSdkScript.src =
        "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" +
        window.CUSTOMHOUSE_CONFIG.KAKAO_MAP_APP_KEY +
        "&libraries=services&autoload=false";
      document.head.appendChild(kakaoSdkScript);
    }
  </script>
  <!-- 주소 검색(우편번호) 팝업 - 다음(카카오) 공개 서비스, 별도 키 불필요 -->
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

  <style>
    body { background: #f6f8fb !important; }
    .reg-shell { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
    .reg-card { background: #fff; border: 1px solid #e7edf4; border-radius: 16px; padding: 28px 24px; }
    .reg-title { font-size: 22px; font-weight: 700; color: var(--brand-600); margin: 0 0 20px; }
    .reg-title:has(+ .reg-sub:not(:empty)) { margin-bottom: 4px; }
    .reg-sub { color: #64748b; font-size: 14px; margin: 0 0 24px; }
    .reg-sub:empty { display: none; }
    .reg-section { border-top: 1px solid #eef1f6; padding-top: 18px; margin-top: 18px; }
    .reg-section:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
    .reg-section h2 { font-size: 15px; font-weight: 700; color: #334155; margin: 0 0 12px; }
    .reg-field { display: block; margin-bottom: 14px; }
    .reg-field > span { display: block; font-size: 13px; color: #475569; margin-bottom: 4px; }
    .reg-field input[type="text"], .reg-field input[type="number"], .reg-field input[type="date"],
    .reg-field select, .reg-field textarea {
      width: 100%; padding: 9px 12px; border: 1px solid #d7dee8; border-radius: 8px; font-size: 14px; box-sizing: border-box;
    }
    .reg-field textarea { min-height: 80px; resize: vertical; }
    .reg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .reg-address-row { display: flex; gap: 8px; }
    .reg-address-row input { flex: 1; background: #f8fafc; }
    .reg-btn-outline {
      white-space: nowrap; padding: 0 16px; border-radius: 8px; border: 1px solid var(--brand-600);
      color: var(--brand-600); background: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .reg-btn-outline:hover { background: var(--brand-600); color: #fff; }
    #reg-map { width: 100%; height: 220px; margin-top: 10px; border-radius: 10px; border: 1px solid #e7edf4; display: none; }
    .reg-map-note { font-size: 12px; color: #64748b; margin-top: 6px; }
    .reg-checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #334155; }
    /* 사진 드롭존: 파일을 끌어다 놓거나, 영역/버튼을 눌러 선택 */
    .reg-dropzone {
      display: flex; align-items: center; gap: 16px; padding: 18px; border: 1.5px dashed #c5d0de; border-radius: 12px;
      background: #f8fafc; cursor: pointer; transition: border-color .15s, background .15s;
    }
    .reg-dropzone:hover, .reg-dropzone:focus-visible { border-color: var(--brand-600); background: #f1f6fd; outline: none; }
    .reg-dropzone.is-dragover { border-color: var(--brand-600); background: #e6effc; border-style: solid; }
    .reg-dropzone-ico { flex: none; width: 44px; height: 44px; border-radius: 12px; background: #e8eef7; color: var(--brand-600); display: flex; align-items: center; justify-content: center; }
    .reg-dropzone-text { flex: 1; min-width: 0; }
    .reg-dropzone-title { font-size: 14px; font-weight: 600; color: #334155; margin: 0 0 2px; }
    .reg-dropzone-hint { font-size: 12px; color: #64748b; margin: 0; }
    .reg-photo-box { display: none; align-items: center; gap: 12px; margin-top: 12px; }
    .reg-photo-box.is-visible { display: flex; }
    .reg-photo-preview { width: 160px; height: 120px; object-fit: cover; border-radius: 10px; border: 1px solid #e7edf4; background: #f1f5f9; }
    .reg-photo-status { font-size: 12px; color: #64748b; margin-top: 8px; min-height: 16px; }
    .reg-photo-status.is-error { color: #b91c1c; }
    .reg-btn-sm { padding: 8px 14px; font-size: 12px; }
    .reg-btn-outline.is-muted { border-color: #cbd5e1; color: #64748b; }
    .reg-btn-outline.is-muted:hover { background: #f1f5f9; color: #334155; }
    .reg-error { background: #fef2f2; color: #b91c1c; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-top: 18px; }
    .reg-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    .reg-cancel { padding: 11px 20px; border-radius: 999px; font-size: 14px; color: #475569; text-decoration: none; }
    .reg-submit {
      padding: 11px 24px; border-radius: 999px; font-size: 14px; font-weight: 700; color: #fff;
      background: var(--brand-600); border: none; cursor: pointer;
    }
    .reg-submit:disabled { opacity: 0.6; cursor: default; }
    /* 광고하기 매물등록 (2026-10-08): 등록하기와 같은 알약형, 테두리형으로 구분 */
    .reg-ad-submit {
      padding: 10px 20px; border-radius: 999px; font-size: 14px; font-weight: 700; color: var(--brand-600);
      background: #fff; border: 1.5px solid var(--brand-600); cursor: pointer;
    }
    .reg-ad-submit:hover { background: #f1f6fd; }
    .reg-ad-submit:disabled { opacity: 0.6; cursor: default; }
    .reg-ad-note { font-size: 12px; color: #64748b; text-align: right; margin: 8px 0 0; }
    .reg-ad-note:empty { display: none; }
    .reg-done { text-align: center; padding: 28px 0 12px; }
    .reg-done .ico { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%; background: #e8f3ec; color: #2f855a; display: flex; align-items: center; justify-content: center; }
    .reg-done-msg { font-size: 16px; font-weight: 700; color: #1e293b; margin: 0; }
    /* 완료 화면 버튼: 같은 크기의 알약형 - 주 동작은 채움, 보조 동작은 테두리 */
    .reg-done-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
    .reg-pill {
      display: inline-flex; align-items: center; justify-content: center; min-width: 190px; padding: 11px 22px;
      border-radius: 999px; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; transition: background .15s, color .15s, filter .15s;
    }
    .reg-pill.primary { background: var(--brand-600); color: #fff; border: 1px solid var(--brand-600); }
    .reg-pill.primary:hover { filter: brightness(1.1); }
    .reg-pill.secondary { background: #fff; color: var(--brand-600); border: 1px solid var(--brand-600); }
    .reg-pill.secondary:hover { background: var(--brand-600); color: #fff; }
    .reg-ico { width: 1em; height: 1em; flex: none; vertical-align: -0.125em; }
    .reg-map-note .reg-ico { color: var(--brand-600); margin-right: 4px; }
    .hidden { display: none !important; }
  </style>
</head>

<body>
  <div id="app-header"></div>

  <main class="reg-shell">
    <div class="reg-card">
      <h1 class="reg-title" id="reg-title">매물 등록</h1>
      <p class="reg-sub" id="reg-sub"></p>

      <div id="login-required" class="hidden">
        <p class="text-gray-500 mb-4">로그인한 회원만 매물을 등록할 수 있어요.</p>
        <a href="../auth/login.html" class="reg-submit" style="display:inline-block;text-decoration:none">로그인하러 가기</a>
      </div>

      <form id="reg-form">
        <section class="reg-section">
          <h2>위치</h2>
          <label class="reg-field">
            <span>주소 (도로명)</span>
            <div class="reg-address-row">
              <input type="text" id="reg-address" readonly placeholder="주소 검색 버튼을 눌러 입력해주세요" />
              <button type="button" class="reg-btn-outline" id="reg-address-search-btn">주소 검색</button>
            </div>
          </label>
          <div id="reg-postcode-wrap" class="hidden" style="margin-top:10px; border:1px solid #d7dee8; border-radius:10px; overflow:hidden;">
            <div style="display:flex; justify-content:flex-end; background:#f8fafc; padding:4px 8px;">
              <button type="button" id="reg-postcode-close" style="border:none; background:none; cursor:pointer; font-size:13px; color:#64748b; display:inline-flex; align-items:center; gap:4px;">
                <svg class="reg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>닫기
              </button>
            </div>
            <div id="reg-postcode-embed" style="width:100%; height:360px;"></div>
          </div>
          <div id="reg-map"></div>
          <p class="reg-map-note hidden" id="reg-map-note"></p>
        </section>

        <section class="reg-section">
          <h2>기본 정보</h2>
          <div class="reg-row">
            <label class="reg-field">
              <span>매물유형</span>
              <select id="reg-property-type">
                <option value="아파트">아파트</option>
                <option value="오피스텔">오피스텔</option>
                <option value="연립다세대">연립·다세대</option>
                <option value="단독다가구">단독·다가구</option>
              </select>
            </label>
            <label class="reg-field">
              <span>거래유형</span>
              <select id="reg-lease-type">
                <option value="월세">월세</option>
                <option value="전세">전세</option>
              </select>
            </label>
          </div>
          <div class="reg-row">
            <label class="reg-field"><span>보증금 (만원)</span><input type="number" id="reg-deposit" min="0" placeholder="예: 5000" /></label>
            <label class="reg-field"><span>월세 (만원, 전세면 0)</span><input type="number" id="reg-monthly-rent" min="0" value="0" /></label>
          </div>
          <div class="reg-row">
            <label class="reg-field"><span>전용면적 (㎡)</span><input type="number" id="reg-area" min="1" step="0.1" placeholder="예: 25.5" /></label>
            <label class="reg-field"><span>건축년도</span><input type="number" id="reg-built-year" min="1950" max="2026" placeholder="예: 2015" /></label>
          </div>
          <div class="reg-row">
            <label class="reg-field"><span>건물명 (선택)</span><input type="text" id="reg-building-name" maxlength="100" /></label>
            <label class="reg-field"><span>동/호수 또는 단독층수 (선택)</span><input type="text" id="reg-unit-label" maxlength="50" placeholder="예: 101동 203호" /></label>
          </div>
          <label class="reg-field"><span>층</span><input type="text" id="reg-floor" maxlength="10" placeholder="예: 5" /></label>
        </section>

        <section class="reg-section">
          <h2>편의시설</h2>
          <div class="reg-row">
            <label class="reg-field"><span>방 수</span><input type="number" id="reg-rooms" min="0" placeholder="예: 2" /></label>
            <label class="reg-field"><span>욕실 수</span><input type="number" id="reg-bathrooms" min="0" placeholder="예: 1" /></label>
          </div>
          <div class="reg-row">
            <label class="reg-field">
              <span>엘리베이터</span>
              <select id="reg-elevator">
                <option value="">선택 안 함</option>
                <option value="true">있음</option>
                <option value="false">없음</option>
              </select>
            </label>
            <label class="reg-field">
              <span>주차 가능여부</span>
              <select id="reg-parking">
                <option value="">선택 안 함</option>
                <option value="가능">가능</option>
                <option value="불가능">불가능</option>
                <option value="협의 가능">협의 가능</option>
              </select>
            </label>
          </div>
          <div class="reg-row">
            <label class="reg-field"><span>이사가능일</span><input type="date" id="reg-move-in-date" /></label>
            <label class="reg-field"><span>관리비 (만원)</span><input type="number" id="reg-maintenance-fee" min="0" value="0" /></label>
          </div>
          <label class="reg-field"><span>관리비 포함 항목 (선택)</span><input type="text" id="reg-maintenance-fee-items" maxlength="100" placeholder="예: 수도, 인터넷 (없으면 비워두세요)" /></label>
          <label class="reg-field reg-checkbox-row">
            <input type="checkbox" id="reg-jeonse-loan-available" checked style="width:16px;height:16px" />
            <span style="margin:0">전세자금대출 가능한 매물이에요</span>
          </label>
        </section>

        <section class="reg-section">
          <h2>사진</h2>
          <div class="reg-field" style="margin-bottom:0">
            <span>내부 사진 (대표 1장, 선택)</span>
            <input type="file" id="reg-photo-input" accept="image/jpeg,image/png,image/webp" class="hidden" />
            <div class="reg-dropzone" id="reg-dropzone" role="button" tabindex="0" aria-label="사진 파일을 끌어다 놓거나 눌러서 선택">
              <div class="reg-dropzone-ico">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5m0 0l-4 4m4-4l4 4"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
              </div>
              <div class="reg-dropzone-text">
                <p class="reg-dropzone-title">사진을 여기로 끌어다 놓으세요</p>
                <p class="reg-dropzone-hint">JPG · PNG · WEBP, 5MB 이하</p>
              </div>
              <button type="button" class="reg-btn-outline reg-btn-sm" id="reg-photo-pick-btn">파일 선택</button>
            </div>
            <div class="reg-photo-box" id="reg-photo-box">
              <img id="reg-photo-preview" class="reg-photo-preview" alt="업로드한 내부 사진 미리보기" />
              <button type="button" class="reg-btn-outline reg-btn-sm is-muted" id="reg-photo-remove-btn">사진 삭제</button>
            </div>
            <p class="reg-photo-status" id="reg-photo-status" role="status"></p>
          </div>
        </section>

        <section class="reg-section">
          <h2>공인중개사 정보 (선택)</h2>
          <div class="reg-row">
            <label class="reg-field"><span>상호</span><input type="text" id="reg-broker-name" maxlength="100" placeholder="예: 맞집공인중개사사무소" /></label>
            <label class="reg-field"><span>대표자</span><input type="text" id="reg-broker-representative" maxlength="50" placeholder="예: 홍길동" /></label>
          </div>
          <div class="reg-row">
            <label class="reg-field"><span>등록번호</span><input type="text" id="reg-broker-reg-no" maxlength="50" placeholder="예: 11650-2026-00001" /></label>
            <label class="reg-field"><span>전화번호</span><input type="text" id="reg-broker-phone" maxlength="30" placeholder="예: 02-1234-5678" /></label>
          </div>
          <label class="reg-field"><span>사무소 주소</span><input type="text" id="reg-broker-address" maxlength="200" placeholder="예: 서울 서초구 동작대로 132" /></label>
          <label class="reg-field"><span>중개사 한마디</span><input type="text" id="reg-broker-comment" maxlength="500" placeholder="예: 즉시 입주 가능한 매물입니다" /></label>
        </section>

        <section class="reg-section">
          <h2>상세 설명</h2>
          <label class="reg-field"><textarea id="reg-description" maxlength="1000" placeholder="매물에 대해 자유롭게 설명해주세요 (선택)"></textarea></label>
        </section>

        <div class="reg-error hidden" id="reg-error" role="alert"></div>
        <div class="reg-actions">
          <a href="report-listings.html" class="reg-cancel">취소</a>
          <button type="button" class="reg-ad-submit" id="reg-ad-submit">📢 광고하기 매물등록</button>
          <button type="submit" class="reg-submit" id="reg-submit">등록하기</button>
        </div>
        <p class="reg-ad-note" id="reg-ad-note"></p>
      </form>

      <div id="reg-done" class="reg-done hidden">
        <div class="ico">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
        <p class="reg-done-msg" id="reg-done-msg"></p>
        <div class="reg-done-actions" id="reg-done-actions"></div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="../../js/components/header.js?v=20260915b"></script>
  <script src="../../js/components/footer.js?v=20260928c"></script>
  <script src="../../js/api/auth.js?v=20260915b"></script>
  <script src="../../js/api/watchlist.js?v=20261001b"></script>
  <!-- 광고하기 결제 (주문 생성 후 결제 화면으로 이동) -->
  <script src="../../js/api/ads.js?v=20261008a"></script>
  <script src="../../js/utils/map-cluster-util.js?v=20261008e"></script>

  <script>
    renderHeader("diagnosis");
    renderFooter();

    const el = (id) => document.getElementById(id);

    // ---------- 수정 모드: ?id=매물번호로 열리면 기존 값을 불러와 채운다 ----------
    const editingListingId = new URLSearchParams(location.search).get("id");

    // ---------- 로그인 가드: 비로그인이면 폼 자체를 숨기고 로그인 유도만 보여준다 ----------
    if (!(window.CustomHouseAuthApi && CustomHouseAuthApi.isLoggedIn())) {
      el("login-required").classList.remove("hidden");
      el("reg-form").classList.add("hidden");
    } else if (editingListingId) {
      el("reg-title").textContent = "매물 수정";
      el("reg-sub").textContent = "바꾸고 싶은 항목만 고쳐서 저장하세요.";
      el("reg-submit").textContent = "수정하기";
      el("reg-ad-submit").classList.add("hidden");   // 광고는 마이페이지 등록한 매물 관리의 "광고하기"에서 신청한다
      (async () => {
        try {
          const existing = await CustomHouseWatchlistApi.getListing(editingListingId);
          fillFormFromListing(existing);
        } catch (err) {
          setError(err.message || "매물 정보를 불러오지 못했어요.");
          el("reg-form").classList.add("hidden");
        }
      })();
    }

    function fillFormFromListing(r) {
      confirmedAddress = r.road_address || r.jibun_address || "";
      el("reg-address").value = confirmedAddress;
      el("reg-property-type").value = r.property_type || "아파트";
      el("reg-lease-type").value = r.lease_type || "월세";
      el("reg-deposit").value = r.deposit ?? "";
      el("reg-monthly-rent").value = r.monthly_rent ?? 0;
      el("reg-area").value = r.exclusive_area ?? "";
      el("reg-built-year").value = r.built_year ?? "";
      el("reg-building-name").value = r.building_name || "";
      el("reg-unit-label").value = r.unit_label || "";
      el("reg-floor").value = r.floor || "";
      el("reg-rooms").value = r.rooms ?? "";
      el("reg-bathrooms").value = r.bathrooms ?? "";
      el("reg-elevator").value = r.elevator === true ? "true" : r.elevator === false ? "false" : "";
      el("reg-parking").value = r.parking || "";
      el("reg-move-in-date").value = r.move_in_date || "";
      el("reg-maintenance-fee").value = r.maintenance_fee ?? 0;
      el("reg-maintenance-fee-items").value = r.maintenance_fee_items || "";
      el("reg-jeonse-loan-available").checked = r.jeonse_loan_available !== false;
      el("reg-description").value = r.description || "";
      el("reg-broker-name").value = r.broker_name || "";
      el("reg-broker-representative").value = r.broker_representative || "";
      el("reg-broker-reg-no").value = r.broker_reg_no || "";
      el("reg-broker-phone").value = r.broker_phone || "";
      el("reg-broker-address").value = r.broker_address || "";
      el("reg-broker-comment").value = r.broker_comment || "";
      if (r.photo && r.photo !== "PHOTO_PLACEHOLDER") {
        uploadedPhotoUrl = r.photo;
        showPhotoPreview(r.photo, false);
        setPhotoStatus("기존 사진이에요. 바꾸려면 새 사진을 끌어다 놓거나 선택하세요.");
      }
      // 핀 표시는 카카오 SDK 로딩을 기다려야 해서 맨 마지막에 - 혹시 실패해도(SDK 없음 등) 이미 위에서
      // 입력칸은 전부 채워진 뒤라 수정 자체는 문제없다.
      if (r.lat && r.lon) {
        waitForKakaoServices(50, (ready) => {
          if (ready) showPinOnMap(r.lat, r.lon, confirmedAddress);
        });
      }
    }

    // ---------- 주소 검색: 다음 우편번호 팝업 -> 도로명주소 확정 -> 카카오 지오코딩 -> 지도에 핀 ----------
    let confirmedAddress = "";
    let map = null;
    let marker = null;

    function waitForKakaoServices(retriesLeft, cb) {
      if (window.kakao && window.kakao.maps) {
        window.kakao.maps.load(() => cb(true));
      } else if (retriesLeft > 0) {
        setTimeout(() => waitForKakaoServices(retriesLeft - 1, cb), 100);
      } else {
        cb(false);
      }
    }

    function showPinOnMap(lat, lon, address) {
      const mapEl = el("reg-map");
      mapEl.style.display = "block";
      const center = new kakao.maps.LatLng(lat, lon);
      if (!map) {
        map = new kakao.maps.Map(mapEl, { center, level: 3 });
        // 터치 이동/확대·축소와 +/- 버튼 (Windows 터치스크린 노트북에서는 카카오맵이 터치를 못 받아서 직접 구현한 것을 쓴다 - map-cluster-util.js)
        if (window.CustomHouseClusterMapUtil) CustomHouseClusterMapUtil.enhanceMap(map, mapEl);
        marker = new kakao.maps.Marker({ position: center, map });
      } else {
        map.setCenter(center);
        marker.setPosition(center);
      }
      const noteEl = el("reg-map-note");
      noteEl.innerHTML = '<svg class="reg-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 1113 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>';
      noteEl.appendChild(document.createTextNode(`${address} — 이 위치가 맞는지 확인해주세요.`));
      noteEl.classList.remove("hidden");
    }

    function waitForDaumPostcode(retriesLeft, cb) {
      if (window.daum && window.daum.Postcode) {
        cb(true);
      } else if (retriesLeft > 0) {
        setTimeout(() => waitForDaumPostcode(retriesLeft - 1, cb), 100);
      } else {
        cb(false);
      }
    }

    function onAddressComplete(data) {
      const address = data.roadAddress || data.jibunAddress;
      confirmedAddress = address;
      el("reg-address").value = address;
      el("reg-postcode-wrap").classList.add("hidden");
      el("reg-postcode-embed").innerHTML = "";

      const kakaoKey = window.CUSTOMHOUSE_CONFIG && window.CUSTOMHOUSE_CONFIG.KAKAO_MAP_APP_KEY;
      if (!kakaoKey) return; // 카카오 키 없으면 핀 확인은 건너뛰고 주소 텍스트만 쓴다
      waitForKakaoServices(50, (ready) => {
        if (!ready) {
          el("reg-map-note").textContent = "지도를 불러오지 못했어요 (주소는 정상 입력됐어요).";
          el("reg-map-note").classList.remove("hidden");
          return;
        }
        new kakao.maps.services.Geocoder().addressSearch(address, (result, status) => {
          if (status === kakao.maps.services.Status.OK && result.length) {
            showPinOnMap(parseFloat(result[0].y), parseFloat(result[0].x), address);
          } else {
            el("reg-map-note").textContent = "이 주소의 좌표를 찾지 못해 지도에는 못 띄웠어요 (주소는 정상 입력됐어요).";
            el("reg-map-note").classList.remove("hidden");
          }
        });
      });
    }

    // 팝업(.open())은 브라우저/확장프로그램의 팝업 차단에 걸리면 아무 반응 없이 조용히 실패한다
    // (2026-10-01 실측 - 클릭이 진짜 사용자 클릭이어도 막혔다) - 그래서 페이지 안에 바로 끼워넣는
    // embed() 방식을 쓴다. 매번 새 인스턴스를 만들어야 한다(다음 우편번호 서비스 권장 사용법).
    el("reg-address-search-btn").addEventListener("click", () => {
      waitForDaumPostcode(30, (daumReady) => {
        if (!daumReady) {
          setError("주소 검색 기능을 불러오지 못했어요. 새로고침 후 다시 시도해주세요.");
          return;
        }
        el("reg-postcode-embed").innerHTML = "";
        el("reg-postcode-wrap").classList.remove("hidden");
        new daum.Postcode({
          oncomplete: onAddressComplete,
          width: "100%",
          height: "100%",
        }).embed(el("reg-postcode-embed"));
      });
    });

    el("reg-postcode-close").addEventListener("click", () => {
      el("reg-postcode-wrap").classList.add("hidden");
      el("reg-postcode-embed").innerHTML = "";
    });

    // ---------- 사진 업로드: 파일을 선택하거나 끌어다 놓으면 즉시 서버에 올리고 URL을 기억해둔다 ----------
    // (ListingPhotoController 제한과 같은 기준: JPG/PNG/WEBP, 5MB 이하 - 서버 검증 전에 화면에서 먼저 안내한다)
    let uploadedPhotoUrl = null;
    let photoUploading = false;
    const PHOTO_TYPES = ["image/jpeg", "image/png", "image/webp"];
    const PHOTO_MAX_BYTES = 5 * 1024 * 1024;
    const dropzone = el("reg-dropzone");
    const photoInput = el("reg-photo-input");

    function setPhotoStatus(text, isError) {
      const statusEl = el("reg-photo-status");
      statusEl.textContent = text || "";
      statusEl.classList.toggle("is-error", !!isError);
    }

    // removable=false: 수정 모드의 기존 사진 - 서버는 새 사진이 올 때만 바꾸므로(사진 없이 저장하면 기존 사진 유지) 삭제 버튼을 숨긴다
    function showPhotoPreview(url, removable = true) {
      el("reg-photo-preview").src = url;
      el("reg-photo-remove-btn").classList.toggle("hidden", !removable);
      el("reg-photo-box").classList.add("is-visible");
    }

    function clearPhoto() {
      uploadedPhotoUrl = null;
      photoInput.value = "";
      el("reg-photo-preview").removeAttribute("src");
      el("reg-photo-box").classList.remove("is-visible");
      setPhotoStatus("");
    }

    async function handlePhotoFile(file) {
      if (!file || photoUploading) return;
      if (!PHOTO_TYPES.includes(file.type)) return setPhotoStatus("JPG, PNG, WEBP 사진만 올릴 수 있어요.", true);
      if (file.size > PHOTO_MAX_BYTES) return setPhotoStatus("사진은 5MB 이하만 올릴 수 있어요.", true);
      photoUploading = true;
      setPhotoStatus("업로드하는 중...");
      try {
        uploadedPhotoUrl = await CustomHouseWatchlistApi.uploadListingPhoto(file);
        showPhotoPreview(uploadedPhotoUrl);
        setPhotoStatus("업로드 완료");
      } catch (err) {
        setPhotoStatus(err.message || "사진을 업로드하지 못했어요.", true);
      } finally {
        photoUploading = false;
        photoInput.value = ""; // 같은 파일을 다시 골라도 change가 일어나게
      }
    }

    photoInput.addEventListener("change", (e) => handlePhotoFile(e.target.files[0]));
    el("reg-photo-pick-btn").addEventListener("click", (e) => {
      e.stopPropagation(); // 드롭존 클릭과 겹쳐 파일 창이 두 번 뜨지 않게
      photoInput.click();
    });
    dropzone.addEventListener("click", () => photoInput.click());
    dropzone.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        photoInput.click();
      }
    });
    el("reg-photo-remove-btn").addEventListener("click", clearPhoto);

    ["dragenter", "dragover"].forEach((type) =>
      dropzone.addEventListener(type, (e) => {
        e.preventDefault();
        dropzone.classList.add("is-dragover");
      })
    );
    ["dragleave", "dragend"].forEach((type) =>
      dropzone.addEventListener(type, () => dropzone.classList.remove("is-dragover"))
    );
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("is-dragover");
      const files = e.dataTransfer && e.dataTransfer.files;
      if (!files || !files.length) return;
      if (files.length > 1) setPhotoStatus("대표 사진은 1장만 쓸 수 있어서 첫 번째 파일만 올렸어요.");
      handlePhotoFile(files[0]);
    });
    // 드롭존 밖에 잘못 놓았을 때 브라우저가 사진 파일을 열어버리며 입력 중이던 내용이 날아가는 것을 막는다
    ["dragover", "drop"].forEach((type) => window.addEventListener(type, (e) => e.preventDefault()));

    // ---------- 등록 제출 ----------
    function setError(text) {
      const box = el("reg-error");
      box.textContent = text || "";
      box.classList.toggle("hidden", !text);
    }

    // 입력 검증 + 서버로 보낼 payload 만들기 (등록하기 / 광고하기 매물등록 공용). 문제가 있으면 오류를 띄우고 null.
    function buildPayload() {
      const addressKeyword = confirmedAddress || el("reg-address").value.trim();
      const propertyType = el("reg-property-type").value;
      const leaseType = el("reg-lease-type").value;
      const deposit = Number(el("reg-deposit").value);
      const monthlyRent = Number(el("reg-monthly-rent").value || 0);
      const exclusiveArea = Number(el("reg-area").value);

      if (!addressKeyword) return setError("주소 검색으로 주소를 입력해주세요."), null;
      if (!deposit || deposit <= 0) return setError("보증금을 입력해주세요."), null;
      if (!exclusiveArea || exclusiveArea <= 0) return setError("전용면적을 입력해주세요."), null;
      setError("");

      const elevatorValue = el("reg-elevator").value;
      const roomsValue = el("reg-rooms").value;
      const bathroomsValue = el("reg-bathrooms").value;
      const builtYearValue = el("reg-built-year").value;

      const payload = {
        addressKeyword, propertyType, leaseType, deposit, monthlyRent, exclusiveArea,
        buildingName: el("reg-building-name").value.trim(),
        unitLabel: el("reg-unit-label").value.trim(),
        floor: el("reg-floor").value.trim(),
        rooms: roomsValue === "" ? null : Number(roomsValue),
        bathrooms: bathroomsValue === "" ? null : Number(bathroomsValue),
        builtYear: builtYearValue === "" ? null : Number(builtYearValue),
        maintenanceFee: Number(el("reg-maintenance-fee").value || 0),
        maintenanceFeeItems: el("reg-maintenance-fee-items").value.trim(),
        parking: el("reg-parking").value,
        elevator: elevatorValue === "" ? null : elevatorValue === "true",
        moveInDate: el("reg-move-in-date").value,
        description: el("reg-description").value.trim(),
        jeonseLoanAvailable: el("reg-jeonse-loan-available").checked,
        photoUrl: uploadedPhotoUrl,
        brokerName: el("reg-broker-name").value.trim(),
        brokerRepresentative: el("reg-broker-representative").value.trim(),
        brokerRegNo: el("reg-broker-reg-no").value.trim(),
        brokerPhone: el("reg-broker-phone").value.trim(),
        brokerAddress: el("reg-broker-address").value.trim(),
        brokerComment: el("reg-broker-comment").value.trim(),
      };
      return payload;
    }

    el("reg-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = buildPayload();
      if (!payload) return;

      const submitBtn = el("reg-submit");
      submitBtn.disabled = true;
      submitBtn.textContent = editingListingId ? "수정하는 중..." : "등록하는 중...";
      try {
        const result = editingListingId
          ? await CustomHouseWatchlistApi.updateListing(editingListingId, payload)
          : await CustomHouseWatchlistApi.registerListing(payload);
        el("reg-form").classList.add("hidden");
        el("reg-done-msg").textContent = editingListingId
          ? `매물이 수정되었어요. (매물번호 ${result.listingId})`
          : `매물이 등록되었어요. (매물번호 ${result.listingId})`;
        // report-listings.html은 진단 결과를 localStorage에 캐시해뒀다가 조건이 안 바뀌면 그대로 보여준다
        // (?justRegistered=1이 강제로 한 번 다시 불러오게 한다) - 수정 직후에도 똑같이 캐시가 수정 전
        // 값 그대로라, 같은 쿼리로 다시 불러오게 한다.
        el("reg-done-actions").innerHTML = editingListingId
          ? `<a href="report-listings.html?justRegistered=1" class="reg-pill primary">추천 리포트에서 확인</a>
             <a href="../mypage/edit-condition.html#my-listings" class="reg-pill secondary">등록한 매물 관리</a>`
          : `<a href="report-listings.html?justRegistered=1" class="reg-pill primary">추천 리포트에서 확인</a>
             <a href="../mypage/edit-condition.html#my-listings" class="reg-pill secondary">등록한 매물 관리</a>`;
        el("reg-done").classList.remove("hidden");
      } catch (err) {
        setError(err.message || (editingListingId ? "매물을 수정하지 못했어요. 잠시 후 다시 시도해주세요." : "매물을 등록하지 못했어요. 잠시 후 다시 시도해주세요."));
        submitBtn.disabled = false;
        submitBtn.textContent = editingListingId ? "수정하기" : "등록하기";
      }
    });

    // ---------- 광고하기 매물등록 (2026-10-08): 결제 -> (성공 시 서버가) 매물 등록 + 광고 접수 ----------
    // 토스 결제창은 이 페이지를 떠났다가 ad-success.html로 돌아온다. 그래서 폼 내용은 주문과 함께 서버에 저장해 두고,
    // 결제가 승인된 뒤에 서버가 그 내용으로 매물을 등록한다 (결제하지 않으면 매물도 등록되지 않는다).
    let adConfig = null;
    if (window.CustomHouseAuthApi && CustomHouseAuthApi.isLoggedIn() && !editingListingId) {
      CustomHouseAdsApi.getConfig().then((cfg) => {
        adConfig = cfg;
        el("reg-ad-note").textContent = `광고하기 매물등록: ${Number(cfg.priceWon).toLocaleString()}원 결제 후 매물이 등록되고, ${cfg.periodDays}일 동안 추천 목록 중간에 노출돼요.`;
      }).catch(() => { /* 가격 안내만 못 보여줄 뿐이라 조용히 넘어간다 - 결제 시 서버가 다시 정한다 */ });
    }

    el("reg-ad-submit").addEventListener("click", async () => {
      const payload = buildPayload();
      if (!payload) return;
      const priceText = adConfig ? `${Number(adConfig.priceWon).toLocaleString()}원` : "광고 요금";
      const periodText = adConfig ? `${adConfig.periodDays}일 동안 ` : "";
      if (!confirm(`${priceText}을 결제하면 매물이 등록되고 ${periodText}추천 목록 중간에 '광고하기 매물'로 노출돼요.
결제창으로 이동할까요?`)) return;

      const adBtn = el("reg-ad-submit");
      const submitBtn = el("reg-submit");
      adBtn.disabled = true;
      submitBtn.disabled = true;
      adBtn.textContent = "결제창을 여는 중...";
      try {
        await CustomHouseAdsApi.payForAd({ listing: payload });   // 결제창으로 이동하면 이 페이지는 떠난다
      } catch (err) {
        setError(err.message || "결제를 시작하지 못했어요. 잠시 후 다시 시도해주세요.");
      }
      // 결제창을 닫았거나 오류가 난 경우에만 여기로 돌아온다
      adBtn.disabled = false;
      submitBtn.disabled = false;
      adBtn.textContent = "📢 광고하기 매물등록";
    });
  </script>
</body>
</html>
