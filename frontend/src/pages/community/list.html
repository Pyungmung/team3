<!DOCTYPE html>
<!-- [담당: 미정 - 커뮤니티 게시판] 게시글 목록 (연동 대상 백엔드: domain/board) -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맞집 | 커뮤니티</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/main.css?v=20260915b" />
</head>
<body>
  <div id="app-header"></div>

  <main class="max-w-3xl mx-auto px-4 py-10">
    <div class="flex items-end justify-between gap-3 mb-5">
      <div>
        <h1 class="text-2xl font-extrabold">커뮤니티</h1>
        <p id="tab-desc" class="text-sm text-gray-500 mt-1">자취·주거 고민을 함께 나눠요</p>
      </div>
      <a id="write-btn" href="write.html" class="text-sm px-4 py-2 rounded-xl text-white brand-gradient font-semibold shrink-0">글쓰기</a>
    </div>

    <!-- 카테고리 탭 -->
    <div id="tabs" class="flex gap-2 overflow-x-auto pb-2 mb-3"></div>

    <div class="flex items-center justify-between mb-3">
      <span id="total" class="text-xs text-gray-400"></span>
      <select id="sort" class="text-xs border border-gray-200 rounded-lg px-2 py-1.5 bg-white">
        <option value="latest">최신순</option>
        <option value="popular">인기순</option>
        <option value="views">조회순</option>
      </select>
    </div>

    <div id="notice" class="hidden card p-6 text-center text-sm text-gray-500 mb-3"></div>
    <ul id="list" class="space-y-3"></ul>
    <div id="empty" class="hidden text-sm text-gray-400 text-center py-12">아직 게시글이 없어요. 첫 글을 남겨보세요!</div>
    <div id="pager" class="flex items-center justify-center gap-1 mt-6"></div>
  </main>

  <div id="app-footer"></div>

  <script src="../../js/components/header.js?v=20260915b"></script>
  <script src="../../js/components/footer.js?v=20260915b"></script>
  <script src="../../js/api/auth.js?v=20260915b"></script>
  <script src="../../js/api/community.js?v=20260921"></script>
  <script>
    renderHeader("community");
    renderFooter();

    const API = CustomHouseCommunityApi;
    const params = new URLSearchParams(location.search);
    const state = {
      tab: params.get("tab") || "ALL", // ALL | 카테고리 키 | SCRAPS
      sort: "latest",
      page: 0,
    };

    const TABS = [{ key: "ALL", label: "전체" }, ...API.CATEGORIES, { key: "SCRAPS", label: "내 스크랩" }];
    const PAGE_SIZE = 10;

    function renderTabs() {
      document.getElementById("tabs").innerHTML = TABS.map((t) => {
        const on = t.key === state.tab;
        return `<button data-tab="${t.key}" class="whitespace-nowrap text-sm px-4 py-2 rounded-full border ${
          on ? "text-white font-semibold" : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50"
        }" style="${on ? "background:var(--brand-600);border-color:var(--brand-600)" : ""}">${t.label}</button>`;
      }).join("");

      const cat = API.CATEGORIES.find((c) => c.key === state.tab);
      document.getElementById("tab-desc").textContent = cat ? cat.desc : state.tab === "SCRAPS" ? "스크랩한 글을 모아봐요" : "자취·주거 고민을 함께 나눠요";
      document.getElementById("sort").classList.toggle("hidden", state.tab === "SCRAPS");
      document.getElementById("write-btn").href = "write.html" + (cat ? `?category=${cat.key}` : "");
    }

    document.getElementById("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-tab]");
      if (!btn) return;
      state.tab = btn.dataset.tab;
      state.page = 0;
      renderTabs();
      load();
    });
    document.getElementById("sort").addEventListener("change", (e) => {
      state.sort = e.target.value;
      state.page = 0;
      load();
    });

    function postCard(p) {
      const thumb = API.safeUrl(p.thumbnailUrl);
      return `
        <li>
          <a href="detail.html?id=${p.id}" class="card p-4 flex gap-3 hover:shadow-md transition-shadow">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5 mb-1.5">
                <span class="text-[11px] px-2 py-0.5 rounded-full" style="background:var(--brand-50);color:var(--brand-600)">${API.esc(API.categoryLabel(p.category))}</span>
                ${p.solved ? '<span class="text-[11px] px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 font-semibold">채택 완료</span>' : ""}
              </div>
              <div class="font-semibold text-sm truncate">${API.esc(p.title)}</div>
              <div class="text-xs text-gray-400 mt-2 flex flex-wrap gap-x-3 gap-y-1">
                <span>${API.esc(p.writerName)}</span>
                <span>${API.timeAgo(p.createdAt)}</span>
                <span>조회 ${p.viewCount}</span>
                <span>♥ ${p.likeCount}</span>
                <span>댓글 ${p.commentCount}</span>
              </div>
            </div>
            ${thumb ? `<img src="${API.esc(thumb)}" alt="" class="w-20 h-20 rounded-lg object-cover shrink-0 bg-slate-100" onerror="this.remove()" />` : ""}
          </a>
        </li>`;
    }

    function renderPager(data) {
      const pager = document.getElementById("pager");
      if (data.totalPages <= 1) {
        pager.innerHTML = "";
        return;
      }
      const start = Math.max(0, Math.min(data.page - 2, data.totalPages - 5));
      const end = Math.min(data.totalPages, start + 5);
      const btn = (label, page, { on = false, disabled = false } = {}) =>
        `<button data-page="${page}" ${disabled ? "disabled" : ""} class="min-w-9 h-9 px-2 rounded-lg text-sm ${
          on ? "text-white font-semibold" : "bg-white border border-slate-200 text-slate-600 hover:bg-slate-50"
        } disabled:opacity-40" style="${on ? "background:var(--brand-600)" : ""}">${label}</button>`;
      let html = btn("‹", data.page - 1, { disabled: data.page === 0 });
      for (let i = start; i < end; i++) html += btn(i + 1, i, { on: i === data.page });
      html += btn("›", data.page + 1, { disabled: data.page >= data.totalPages - 1 });
      pager.innerHTML = html;
    }
    document.getElementById("pager").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-page]");
      if (!btn || btn.disabled) return;
      state.page = Number(btn.dataset.page);
      load();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    async function load() {
      const listEl = document.getElementById("list");
      const emptyEl = document.getElementById("empty");
      const notice = document.getElementById("notice");
      notice.classList.add("hidden");
      emptyEl.classList.add("hidden");

      if (state.tab === "SCRAPS" && !CustomHouseAuthApi.isLoggedIn()) {
        listEl.innerHTML = "";
        document.getElementById("total").textContent = "";
        document.getElementById("pager").innerHTML = "";
        notice.innerHTML = '로그인하면 스크랩한 글을 볼 수 있어요.<br><a href="../auth/login.html" class="inline-block mt-3 text-sm px-4 py-2 rounded-xl text-white brand-gradient">로그인하기</a>';
        notice.classList.remove("hidden");
        return;
      }

      listEl.innerHTML = '<li class="text-center text-sm text-gray-400 py-12">불러오는 중...</li>';
      try {
        const data =
          state.tab === "SCRAPS"
            ? await API.listMyScraps({ page: state.page, size: PAGE_SIZE })
            : await API.listPosts({ category: state.tab === "ALL" ? null : state.tab, page: state.page, size: PAGE_SIZE, sort: state.sort });
        document.getElementById("total").textContent = `총 ${data.totalElements}개`;
        listEl.innerHTML = data.content.map(postCard).join("");
        emptyEl.classList.toggle("hidden", data.content.length > 0);
        renderPager(data);
      } catch (err) {
        listEl.innerHTML = "";
        notice.textContent = err.status ? err.message : "서버에 연결할 수 없어요. 백엔드(8080)가 켜져 있는지 확인해주세요.";
        notice.classList.remove("hidden");
      }
    }

    renderTabs();
    load();
  </script>
</body>
</html>
