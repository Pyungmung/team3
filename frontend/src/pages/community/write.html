<!DOCTYPE html>
<!-- [담당: 미정 - 커뮤니티 게시판] 글쓰기 / 수정 (write.html?category=HOUSING, 수정: write.html?id=3) -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맞집 | 글쓰기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/main.css?v=20260915b" />
</head>
<body>
  <div id="app-header"></div>

  <main class="max-w-2xl mx-auto px-4 py-10">
    <div id="guest-view" class="hidden card p-6 text-center">
      <p class="text-sm text-gray-500 mb-4">글을 쓰려면 로그인이 필요해요.</p>
      <a href="../auth/login.html" class="text-sm px-4 py-2 rounded-xl text-white brand-gradient inline-block">로그인하기</a>
    </div>

    <form id="form" class="hidden space-y-5">
      <h1 id="page-title" class="text-2xl font-extrabold">글쓰기</h1>

      <div class="card p-5 space-y-4">
        <label class="block">
          <span class="text-xs font-semibold text-slate-500">게시판</span>
          <select id="category" class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white"></select>
        </label>
        <label class="block">
          <span class="text-xs font-semibold text-slate-500">제목</span>
          <input id="title" type="text" maxlength="100" required placeholder="제목을 입력하세요 (100자 이내)"
                 class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" />
        </label>
        <label class="block">
          <span class="text-xs font-semibold text-slate-500">내용</span>
          <textarea id="content" rows="9" maxlength="10000" required placeholder="내용을 입력하세요"
                    class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"></textarea>
        </label>
      </div>

      <!-- SAFETY -->
      <div id="sec-SAFETY" class="hidden card p-5">
        <label class="flex items-start gap-2 text-sm">
          <input id="anonymous" type="checkbox" class="mt-0.5" />
          <span>
            <b>익명으로 작성</b>
            <span class="block text-xs text-gray-400">작성자 정보는 다른 사용자에게 절대 보이지 않아요. 등록 후에는 바꿀 수 없어요.</span>
          </span>
        </label>
      </div>

      <!-- HOUSING -->
      <div id="sec-HOUSING" class="hidden space-y-5">
        <div class="card p-5 space-y-3">
          <div>
            <h2 class="font-bold text-sm">비교하고 싶은 매물 정보 <span class="text-xs font-normal text-gray-400">(선택)</span></h2>
          </div>
          <input data-meta="LISTING_ADDRESS" maxlength="200" placeholder="주소 (예: 서울시 관악구 봉천동 123-4)" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" />
          <div class="grid grid-cols-2 gap-2">
            <input data-meta="LISTING_DEPOSIT" maxlength="30" placeholder="보증금 (예: 1000만원)" class="border border-gray-200 rounded-lg px-3 py-2 text-sm" />
            <input data-meta="LISTING_MONTHLY_RENT" maxlength="30" placeholder="월세 (예: 55만원)" class="border border-gray-200 rounded-lg px-3 py-2 text-sm" />
            <input data-meta="LISTING_AREA" maxlength="30" placeholder="면적 (예: 23㎡)" class="border border-gray-200 rounded-lg px-3 py-2 text-sm" />
            <input data-meta="LISTING_TYPE" maxlength="50" placeholder="유형 (예: 원룸, 오피스텔)" class="border border-gray-200 rounded-lg px-3 py-2 text-sm" />
          </div>
          <input data-meta="LISTING_URL" maxlength="500" placeholder="매물 링크 (https://...)" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" />
        </div>

        <div id="vote-box" class="card p-5 space-y-3">
          <h2 class="font-bold text-sm">투표 만들기 <span class="text-xs font-normal text-gray-400">(선택, 2~5개 · 등록 후 수정 불가)</span></h2>
          <div id="vote-inputs" class="space-y-2"></div>
          <button type="button" id="vote-add" class="text-xs px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50">+ 항목 추가</button>
        </div>
      </div>

      <!-- INTERIOR -->
      <div id="sec-INTERIOR" class="hidden card p-5 space-y-3">
        <h2 class="font-bold text-sm">우리 집 정보</h2>
        <div class="grid grid-cols-2 gap-2">
          <select data-meta="HOUSING_TYPE" class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white">
            <option value="">주거 형태</option>
            <option>원룸</option><option>투룸</option><option>오피스텔</option><option>빌라</option><option>아파트</option><option>기타</option>
          </select>
          <input data-meta="AREA_PYEONG" maxlength="20" placeholder="평수 (예: 6)" class="border border-gray-200 rounded-lg px-3 py-2 text-sm" />
        </div>
        <label class="block">
          <span class="text-xs font-semibold text-slate-500">사진 주소 (한 줄에 하나씩, 앞쪽이 대표 사진)</span>
          <textarea id="images" rows="4" placeholder="https://example.com/room1.jpg&#10;https://example.com/room2.jpg"
                    class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"></textarea>
          <span class="text-xs text-gray-400">사진 파일 업로드는 아직 지원하지 않아 이미지 주소(URL)로 올려요.</span>
        </label>
      </div>

      <p id="msg" class="text-sm text-red-500"></p>
      <div class="flex gap-2">
        <a id="cancel" href="list.html" class="flex-1 text-center py-3 rounded-xl border border-slate-200 text-sm text-slate-600 bg-white">취소</a>
        <button id="submit" type="submit" class="flex-[2] py-3 rounded-xl text-white font-semibold brand-gradient text-sm">등록하기</button>
      </div>
    </form>
  </main>

  <div id="app-footer"></div>

  <script src="../../js/components/header.js?v=20260915b"></script>
  <script src="../../js/components/footer.js?v=20260915b"></script>
  <script src="../../js/api/auth.js?v=20260915b"></script>
  <script src="../../js/api/community.js?v=20260921"></script>
  <script>
    renderHeader("community");
    renderFooter();

    const API = CustomHouseCommunityApi;
    const params = new URLSearchParams(location.search);
    const editId = params.get("id");
    const $ = (id) => document.getElementById(id);
    let carriedPins = []; // 수정 시 기존 IMAGE_PIN은 그대로 이어서 보낸다 (수정 API가 부가정보를 통째로 교체하므로)

    if (!CustomHouseAuthApi.isLoggedIn()) {
      $("guest-view").classList.remove("hidden");
    } else {
      $("form").classList.remove("hidden");
      init();
    }

    function currentCategory() {
      return $("category").value;
    }

    function syncSections() {
      const cat = currentCategory();
      API.CATEGORIES.forEach((c) => {
        const sec = $("sec-" + c.key);
        if (sec) sec.classList.toggle("hidden", c.key !== cat);
      });
    }

    function addVoteInput(value = "") {
      const box = $("vote-inputs");
      if (box.children.length >= 5) return;
      const row = document.createElement("div");
      row.className = "flex gap-2";
      row.innerHTML = `<input maxlength="50" placeholder="항목 ${box.children.length + 1}" class="vote-input flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm" />
        <button type="button" class="text-xs px-3 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50">삭제</button>`;
      row.querySelector("input").value = value;
      row.querySelector("button").addEventListener("click", () => row.remove());
      box.appendChild(row);
    }

    async function init() {
      $("category").innerHTML = API.CATEGORIES.map((c) => `<option value="${c.key}">${c.label}</option>`).join("");
      const initial = params.get("category");
      if (initial && API.CATEGORIES.some((c) => c.key === initial)) $("category").value = initial;
      $("category").addEventListener("change", syncSections);
      $("vote-add").addEventListener("click", () => addVoteInput());
      addVoteInput();
      addVoteInput();

      if (editId) await loadForEdit();
      syncSections();
      $("form").addEventListener("submit", onSubmit);
    }

    async function loadForEdit() {
      $("page-title").textContent = "글 수정";
      $("submit").textContent = "수정하기";
      $("cancel").href = `detail.html?id=${editId}`;
      try {
        const post = await API.getPost(editId);
        if (!post.mine) throw new Error("본인이 쓴 글만 수정할 수 있어요.");

        $("category").value = post.category;
        $("category").disabled = true; // 카테고리/익명/투표 항목은 수정 불가
        $("title").value = post.title;
        $("content").value = post.content;
        $("anonymous").checked = post.anonymous;
        $("anonymous").disabled = true;
        $("vote-box").classList.add("hidden");

        const images = [];
        post.metas.forEach((m) => {
          if (m.key === "IMAGE_URL") images.push(m.value);
          else if (m.key === "IMAGE_PIN") carriedPins.push(m.value);
          else {
            const el = document.querySelector(`[data-meta="${m.key}"]`);
            if (el) el.value = m.value;
          }
        });
        $("images").value = images.join("\n");
      } catch (err) {
        $("form").classList.add("hidden");
        $("guest-view").classList.remove("hidden");
        $("guest-view").innerHTML = `<p class="text-sm text-gray-500 mb-4">${API.esc(err.message)}</p><a href="list.html" class="text-sm px-4 py-2 rounded-xl text-white brand-gradient inline-block">목록으로</a>`;
      }
    }

    function collectMetas(cat) {
      const metas = [];
      const section = $("sec-" + cat);
      if (section) {
        section.querySelectorAll("[data-meta]").forEach((el) => {
          const value = el.value.trim();
          if (value) metas.push({ key: el.dataset.meta, value });
        });
      }
      if (cat === "INTERIOR") {
        $("images").value.split("\n").map((s) => s.trim()).filter(Boolean).forEach((url) => {
          if (!API.safeUrl(url)) throw new Error("사진 주소는 http:// 또는 https://로 시작해야 해요.");
          metas.push({ key: "IMAGE_URL", value: url });
        });
        carriedPins.forEach((value) => metas.push({ key: "IMAGE_PIN", value }));
      }
      const link = metas.find((m) => m.key === "LISTING_URL");
      if (link && !API.safeUrl(link.value)) throw new Error("매물 링크는 http:// 또는 https://로 시작해야 해요.");
      return metas;
    }

    async function onSubmit(e) {
      e.preventDefault();
      const msg = $("msg");
      const btn = $("submit");
      msg.textContent = "";
      const cat = currentCategory();

      try {
        const metas = collectMetas(cat);
        btn.disabled = true;
        btn.textContent = "저장 중...";

        if (editId) {
          await API.updatePost(editId, { title: $("title").value, content: $("content").value, metas });
          location.href = `detail.html?id=${editId}`;
          return;
        }

        const payload = { category: cat, title: $("title").value, content: $("content").value, metas };
        if (cat === "SAFETY") payload.anonymous = $("anonymous").checked;
        if (cat === "HOUSING") {
          const options = [...document.querySelectorAll(".vote-input")].map((i) => i.value.trim()).filter(Boolean);
          if (options.length === 1) throw new Error("투표는 항목이 2개 이상이어야 해요. 비워두면 투표 없이 등록돼요.");
          if (options.length >= 2) payload.voteOptions = options;
        }
        const created = await API.createPost(payload);
        location.href = `detail.html?id=${created.id}`;
      } catch (err) {
        msg.textContent = err.message;
        btn.disabled = false;
        btn.textContent = editId ? "수정하기" : "등록하기";
      }
    }
  </script>
</body>
</html>
