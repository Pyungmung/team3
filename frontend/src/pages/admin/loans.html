<!DOCTYPE html>
<!-- [담당: 송귀성] 관리자 수정 > 전세자금대출: 대출 5종의 자격 조건/우대사항을 입력한다 (관리자 계정 전용) -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맞집 | 관리자 수정</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/main.css?v=20260915b" />
  <style>
    .adm-tab { padding: 10px 18px; font-size: 15px; font-weight: 800; color: #94a3b8; border-bottom: 3px solid transparent; white-space: nowrap; }
    .adm-tab:hover { color: #64748b; }
    .adm-tab.active { color: var(--brand-600, #1B2A4A); border-bottom-color: var(--brand-600, #1B2A4A); }
    .adm-subtabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .adm-subtab { border: 1px solid #cbd5e1; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 700; color: #475569; background: #fff; }
    .adm-subtab:hover { border-color: #94a3b8; }
    .adm-subtab.active { background: var(--brand-600, #1B2A4A); border-color: var(--brand-600, #1B2A4A); color: #fff; }
    .adm-subtab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 999px; background: #22c55e; margin-left: 6px; }
    .adm-subtab.active .dot { background: #86efac; }
    .adm-field span.lbl { display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 5px; }
    .adm-field input[type=number], .adm-field input[type=url] { width: 100%; font-size: 14px; color: #0f172a; border: 1px solid #cbd5e1; border-radius: 8px; padding: 9px 11px; background: #fff; }
    .adm-field input[type=number]:focus, .adm-field input[type=url]:focus { outline: 2px solid #93c5fd; border-color: #3b82f6; }
    .adm-range { display: flex; align-items: center; gap: 8px; }
    .adm-range em { font-style: normal; color: #94a3b8; }
    .adm-unit { font-size: 11px; color: #94a3b8; margin-top: 3px; }
    .adm-ref-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; }
    .adm-ref-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
    .adm-ref-row input[type=url] { flex: 1; min-width: 200px; }
    .adm-ref-btn { font-size: 13px; font-weight: 700; border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
    .adm-ref-btn:disabled { opacity: .6; cursor: progress; }
    .adm-ref-save { border: 1px solid #1d4ed8; background: #1d4ed8; color: #fff; }
    .adm-ref-open { border: 1px solid #cbd5e1; background: #fff; color: #475569; }
    .adm-ref-open:disabled { opacity: .4; cursor: not-allowed; }
    .adm-pref-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .adm-pref-table th { text-align: left; font-size: 11px; font-weight: 700; color: #94a3b8; padding: 6px 10px; border-bottom: 1px solid #e2e8f0; }
    .adm-pref-table td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .adm-pref-table input[type=number] { width: 110px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 7px 9px; }
    .adm-pref-table input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--brand-600, #1B2A4A); }
    .adm-badge { display: inline-block; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 3px 10px; }
    .adm-badge.saved { background: #dcfce7; color: #166534; }
    .adm-badge.empty { background: #f1f5f9; color: #64748b; }
    .adm-btn { font-size: 14px; font-weight: 800; border-radius: 10px; padding: 10px 22px; cursor: pointer; }
    .adm-btn:disabled { opacity: .6; cursor: progress; }
    .adm-save { border: 1px solid #1d4ed8; background: #1d4ed8; color: #fff; }
    .adm-del { border: 1px solid #fca5a5; background: #fff; color: #dc2626; }
    .adm-del:hover { background: #fef2f2; }
    .adm-msg { font-size: 13px; font-weight: 700; }
    .adm-msg.ok { color: #16a34a; }
    .adm-msg.err { color: #dc2626; }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main class="max-w-4xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-extrabold mb-1">관리자 수정</h1>
    <p class="text-sm text-gray-500 mb-6">리포트의 "[대출이름] 실질주거비" 계산에 쓰이는 대출 조건을 설정합니다. 관리자 계정만 볼 수 있어요.</p>

    <!-- 로그인 필요 / 관리자 아님 / 불러오기 실패 안내 -->
    <div id="notice" class="hidden card p-6 text-center"></div>

    <div id="admin-view" class="hidden">
      <!-- 상단 탭: 지금은 전세자금대출 하나. 앞으로 다른 관리 탭이 이 줄에 추가된다 -->
      <div class="flex border-b border-slate-200 mb-6 overflow-x-auto" role="tablist">
        <button type="button" class="adm-tab active" role="tab" aria-selected="true" data-top-tab="loans">전세자금대출</button>
      </div>

      <section id="tab-loans">
        <div id="loan-subtabs" class="adm-subtabs mb-5" role="tablist" aria-label="대출 종류"></div>
        <div id="loan-panels"></div>
      </section>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="../../js/components/header.js?v=20260928a"></script>
  <script src="../../js/components/footer.js?v=20260928c"></script>
  <script src="../../js/api/auth.js?v=20260915b"></script>
  <script src="../../js/api/admin-loans.js?v=20260928a"></script>
  <script>
    renderHeader("admin");
    renderFooter();

    // 대출 이름/우대사항 이름은 서버가 내려주는 값이지만 화면에 넣기 전에 항상 이스케이프한다.
    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    }

    const noticeEl = document.getElementById("notice");
    const adminViewEl = document.getElementById("admin-view");
    const subtabsEl = document.getElementById("loan-subtabs");
    const panelsEl = document.getElementById("loan-panels");
    let preferenceOptions = [];

    function showNotice(html) {
      adminViewEl.classList.add("hidden");
      noticeEl.innerHTML = html;
      noticeEl.classList.remove("hidden");
    }

    // ---------- 폼 <-> 데이터 ----------
    const numOrNull = (el) => (el.value.trim() === "" ? null : Number(el.value));

    function panelHtml(loan) {
      const prefRows = preferenceOptions
        .map((opt) => {
          const p = (loan.preferences || {})[opt.key] || { required: false, discount: 0 };
          return `
            <tr>
              <td class="font-semibold">${esc(opt.label)}</td>
              <td><label class="inline-flex items-center gap-2 text-sm text-gray-600"><input type="checkbox" data-pref-required="${esc(opt.key)}" ${p.required ? "checked" : ""} />필수조건</label></td>
              <td><input type="number" min="0" max="10" step="0.01" data-pref-discount="${esc(opt.key)}" value="${p.discount ?? 0}" /> <span class="text-xs text-gray-400">%p</span></td>
            </tr>`;
        })
        .join("");

      return `
        <form class="card p-6 space-y-6" data-loan="${esc(loan.type)}" novalidate>
          <div class="flex items-center justify-between gap-3 flex-wrap">
            <h2 class="text-lg font-extrabold">${esc(loan.name)}</h2>
            <span class="adm-badge ${loan.saved ? "saved" : "empty"}" data-badge>${loan.saved ? "저장됨" : "미설정"}</span>
          </div>

          <div class="adm-ref-box">
            <span class="lbl">참고 확인 페이지 <span class="font-medium text-slate-400">(계산에는 안 쓰여요 - 조사할 때 참고한 홈페이지만 저장해둬요)</span></span>
            <div class="adm-ref-row">
              <input type="url" data-ref-url placeholder="https://..." value="${esc(loan.referenceUrl ?? "")}" />
              <button type="button" class="adm-ref-btn adm-ref-save" data-save-ref>저장</button>
              <button type="button" class="adm-ref-btn adm-ref-open" data-open-ref>이동 ↗</button>
            </div>
            <span class="adm-msg" data-ref-msg role="status"></span>
          </div>

          <div>
            <h3 class="text-sm font-extrabold text-slate-700 mb-3">공통 조건 <span class="font-medium text-slate-400">(금액은 만원 단위 · 비워두면 제한 없음)</span></h3>
            <div class="grid sm:grid-cols-2 gap-4">
              <div class="adm-field">
                <span class="lbl">나이 제한 (만)</span>
                <div class="adm-range">
                  <input type="number" min="0" max="120" step="1" data-field="minAge" value="${loan.minAge ?? ""}" placeholder="최소" />
                  <em>~</em>
                  <input type="number" min="0" max="120" step="1" data-field="maxAge" value="${loan.maxAge ?? ""}" placeholder="최대" />
                </div>
              </div>
              <div class="adm-field">
                <span class="lbl">총자산액 (이하)</span>
                <input type="number" min="0" step="1" data-field="maxAsset" value="${loan.maxAsset ?? ""}" placeholder="예: 33700" />
                <div class="adm-unit">만원</div>
              </div>
              <div class="adm-field">
                <span class="lbl">연소득 (이하) - 개인</span>
                <input type="number" min="0" step="1" data-field="maxIncomeSingle" value="${loan.maxIncomeSingle ?? ""}" placeholder="예: 5000" />
                <div class="adm-unit">만원</div>
              </div>
              <div class="adm-field">
                <span class="lbl">연소득 (이하) - 부부합산</span>
                <input type="number" min="0" step="1" data-field="maxIncomeCouple" value="${loan.maxIncomeCouple ?? ""}" placeholder="예: 6000" />
                <div class="adm-unit">만원</div>
              </div>
              <div class="adm-field">
                <span class="lbl">매물 보증금 제한 (이하)</span>
                <input type="number" min="0" step="1" data-field="maxListingDeposit" value="${loan.maxListingDeposit ?? ""}" placeholder="예: 20000" />
                <div class="adm-unit">만원 · 이 금액을 넘는 매물에는 이 대출을 적용하지 않아요</div>
              </div>
              <div class="adm-field">
                <span class="lbl">전용면적 (이하)</span>
                <input type="number" min="0" step="0.01" data-field="maxExclusiveArea" value="${loan.maxExclusiveArea ?? ""}" placeholder="예: 85" />
                <div class="adm-unit">㎡</div>
              </div>
              <div class="adm-field">
                <span class="lbl">최대 대출금 비율한도 (%)</span>
                <input type="number" min="0" max="100" step="0.1" data-field="maxLoanRatioPercent" value="${loan.maxLoanRatioPercent ?? ""}" placeholder="예: 80" />
                <div class="adm-unit">매물 보증금 중 이 비율까지만 대출 가능해요 (예: 80이면 보증금의 80%)</div>
              </div>
              <div class="adm-field">
                <span class="lbl">최대 대출금액</span>
                <input type="number" min="0" step="1" data-field="maxLoanAmount" value="${loan.maxLoanAmount ?? ""}" placeholder="예: 20000" />
                <div class="adm-unit">만원 · 매물과 무관하게 이 대출로 빌릴 수 있는 최대 금액이에요</div>
              </div>
            </div>
            <p class="text-xs text-slate-400 mt-3">두 한도를 모두 입력하면 더 낮은 쪽이 실제 한도예요. 대출로 메워야 하는 부족분(매물 보증금 − 현재 보증금)이 이 한도를 넘으면 이 대출로는 그 매물을 감당할 수 없어 "신청 가능"에서 빠져요.</p>
          </div>

          <div>
            <h3 class="text-sm font-extrabold text-slate-700 mb-1">정부 주거지원 정책 우대사항</h3>
            <p class="text-xs text-slate-400 mb-3">필수조건에 체크하면 그 우대사항에 해당해야 이 대출을 받을 수 있어요. 우대금리 차감은 해당 우대사항일 때 연 이자율에서 자동으로 빼는 값입니다.</p>
            <div class="overflow-x-auto">
              <table class="adm-pref-table">
                <thead><tr><th>우대사항</th><th>필수 여부</th><th>우대금리 차감</th></tr></thead>
                <tbody>${prefRows}</tbody>
              </table>
            </div>
          </div>

          <div class="rounded-lg bg-slate-50 border border-slate-200 px-4 py-3 text-xs text-slate-500">
            이 대출의 <b>이자 계산식</b>은 다음 단계에서 이 탭에 추가됩니다.
          </div>

          <div class="flex items-center gap-3 flex-wrap">
            <button type="submit" class="adm-btn adm-save" data-save>수정완료</button>
            <button type="button" class="adm-btn adm-del" data-delete>삭제</button>
            <span class="adm-msg" data-msg role="status"></span>
          </div>
        </form>`;
    }

    function readForm(form) {
      const val = (name) => numOrNull(form.querySelector(`[data-field="${name}"]`));
      const preferences = {};
      preferenceOptions.forEach((opt) => {
        const discountEl = form.querySelector(`[data-pref-discount="${opt.key}"]`);
        preferences[opt.key] = {
          required: form.querySelector(`[data-pref-required="${opt.key}"]`).checked,
          discount: discountEl.value.trim() === "" ? 0 : Number(discountEl.value),
        };
      });
      return {
        minAge: val("minAge"), maxAge: val("maxAge"), maxIncomeSingle: val("maxIncomeSingle"),
        maxIncomeCouple: val("maxIncomeCouple"), maxAsset: val("maxAsset"), maxListingDeposit: val("maxListingDeposit"), maxExclusiveArea: val("maxExclusiveArea"),
        maxLoanRatioPercent: val("maxLoanRatioPercent"), maxLoanAmount: val("maxLoanAmount"),
        preferences,
      };
    }

    /** 저장 전에 화면에서 먼저 확인한다 (서버도 같은 규칙을 다시 검사한다). 문제가 있으면 안내 문구를 돌려준다. */
    function validate(p) {
      const isInt = (v) => v === null || (Number.isInteger(v) && v >= 0);
      if (![p.minAge, p.maxAge, p.maxIncomeSingle, p.maxIncomeCouple, p.maxAsset, p.maxListingDeposit, p.maxLoanAmount].every(isInt)) return "나이와 금액은 0 이상의 정수(만원)로 입력해주세요.";
      if ((p.minAge !== null && p.minAge > 120) || (p.maxAge !== null && p.maxAge > 120)) return "나이는 120 이하로 입력해주세요.";
      if (p.minAge !== null && p.maxAge !== null && p.minAge > p.maxAge) return "최소 나이는 최대 나이보다 클 수 없어요.";
      if (p.maxExclusiveArea !== null && !(p.maxExclusiveArea >= 0)) return "전용면적은 0 이상으로 입력해주세요.";
      if (p.maxLoanRatioPercent !== null && !(p.maxLoanRatioPercent >= 0 && p.maxLoanRatioPercent <= 100)) return "최대 대출금 비율한도는 0~100% 사이로 입력해주세요.";
      for (const [key, pref] of Object.entries(p.preferences)) {
        if (!(pref.discount >= 0 && pref.discount <= 10)) return "우대금리 차감은 0~10%p 사이로 입력해주세요.";
      }
      return "";
    }

    function setMsg(form, text, kind) {
      const el = form.querySelector("[data-msg]");
      el.textContent = text || "";
      el.className = "adm-msg" + (kind ? " " + kind : "");
    }

    function setRefMsg(form, text, kind) {
      const el = form.querySelector("[data-ref-msg]");
      el.textContent = text || "";
      el.className = "adm-msg" + (kind ? " " + kind : "");
    }

    function setSaved(type, saved) {
      const form = panelsEl.querySelector(`form[data-loan="${type}"]`);
      const badge = form.querySelector("[data-badge]");
      badge.textContent = saved ? "저장됨" : "미설정";
      badge.className = "adm-badge " + (saved ? "saved" : "empty");
      const dot = subtabsEl.querySelector(`[data-type="${type}"] .dot`);
      if (dot) dot.style.display = saved ? "inline-block" : "none";
    }

    function resetForm(form) {
      form.querySelectorAll("[data-field]").forEach((el) => (el.value = ""));
      form.querySelectorAll("[data-pref-required]").forEach((el) => (el.checked = false));
      form.querySelectorAll("[data-pref-discount]").forEach((el) => (el.value = 0));
    }

    // ---------- 화면 그리기 ----------
    function selectSubtab(type) {
      subtabsEl.querySelectorAll(".adm-subtab").forEach((b) => {
        const on = b.dataset.type === type;
        b.classList.toggle("active", on);
        b.setAttribute("aria-selected", String(on));
      });
      // 폼은 5개를 모두 그려두고 보이기만 바꾼다 (탭을 옮겨도 입력 중인 값이 사라지지 않게)
      panelsEl.querySelectorAll("form[data-loan]").forEach((f) => f.classList.toggle("hidden", f.dataset.loan !== type));
    }

    function render(data) {
      preferenceOptions = data.preferenceOptions || [];
      subtabsEl.innerHTML = data.loans
        .map((l) => `<button type="button" class="adm-subtab" role="tab" data-type="${esc(l.type)}">${esc(l.name)}<span class="dot" style="display:${l.saved ? "inline-block" : "none"}"></span></button>`)
        .join("");
      panelsEl.innerHTML = data.loans.map(panelHtml).join("");
      selectSubtab(data.loans[0].type);
      adminViewEl.classList.remove("hidden");
      noticeEl.classList.add("hidden");
    }

    subtabsEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".adm-subtab");
      if (btn) selectSubtab(btn.dataset.type);
    });

    // 수정완료(저장) / 삭제 - 폼이 5개라 패널 컨테이너에서 이벤트를 받는다
    panelsEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target.closest("form[data-loan]");
      const type = form.dataset.loan;
      const payload = readForm(form);
      const problem = validate(payload);
      if (problem) return setMsg(form, problem, "err");

      const btn = form.querySelector("[data-save]");
      btn.disabled = true;
      setMsg(form, "저장 중...", "");
      try {
        await CustomHouseAdminLoansApi.saveLoan(type, payload);
        setSaved(type, true);
        setMsg(form, "저장했어요.", "ok");
      } catch (err) {
        setMsg(form, err.message || "저장하지 못했어요.", "err");
      } finally {
        btn.disabled = false;
      }
    });

    panelsEl.addEventListener("click", async (e) => {
      const delBtn = e.target.closest("[data-delete]");
      if (delBtn) {
        const form = delBtn.closest("form[data-loan]");
        const type = form.dataset.loan;
        const name = form.querySelector("h2").textContent;
        if (!confirm(`'${name}'에 저장된 조건을 삭제할까요?\n삭제하면 이 대출은 리포트 계산에서 제외돼요.`)) return;

        delBtn.disabled = true;
        setMsg(form, "삭제 중...", "");
        try {
          await CustomHouseAdminLoansApi.deleteLoan(type);
          resetForm(form);
          setSaved(type, false);
          setMsg(form, "삭제했어요.", "ok");
        } catch (err) {
          setMsg(form, err.message || "삭제하지 못했어요.", "err");
        } finally {
          delBtn.disabled = false;
        }
        return;
      }

      // 참고 확인 페이지 저장 - 대출 조건과 무관하게 독립적으로 저장된다 (readForm/validate를 거치지 않는다)
      const saveRefBtn = e.target.closest("[data-save-ref]");
      if (saveRefBtn) {
        const form = saveRefBtn.closest("form[data-loan]");
        const type = form.dataset.loan;
        const url = form.querySelector("[data-ref-url]").value.trim();
        if (url && !/^https?:\/\/.+/.test(url)) return setRefMsg(form, "http:// 또는 https://로 시작하는 주소를 입력해주세요.", "err");

        saveRefBtn.disabled = true;
        setRefMsg(form, "저장 중...", "");
        try {
          await CustomHouseAdminLoansApi.saveLoanReferenceUrl(type, url);
          setRefMsg(form, "저장했어요.", "ok");
        } catch (err) {
          setRefMsg(form, err.message || "저장하지 못했어요.", "err");
        } finally {
          saveRefBtn.disabled = false;
        }
        return;
      }

      // 참고 확인 페이지 이동 - 저장 여부와 무관하게 지금 입력칸에 있는 주소를 새 창으로 연다
      const openRefBtn = e.target.closest("[data-open-ref]");
      if (openRefBtn) {
        const form = openRefBtn.closest("form[data-loan]");
        const url = form.querySelector("[data-ref-url]").value.trim();
        if (!url) return setRefMsg(form, "먼저 참고 페이지 주소를 입력해주세요.", "err");
        if (!/^https?:\/\/.+/.test(url)) return setRefMsg(form, "http:// 또는 https://로 시작하는 주소를 입력해주세요.", "err");
        window.open(url, "_blank", "noopener,noreferrer");
      }
    });

    // ---------- 시작 ----------
    (async function init() {
      if (!CustomHouseAuthApi.isLoggedIn()) {
        return showNotice(`<p class="text-sm text-gray-500 mb-4">관리자 계정으로 로그인해주세요.</p>
          <a href="../auth/login.html" class="text-sm px-4 py-2 rounded-xl text-white brand-gradient inline-block">로그인하기</a>`);
      }
      try {
        render(await CustomHouseAdminLoansApi.getLoans());
      } catch (err) {
        if (err.status === 403 || err.code === "FORBIDDEN") {
          showNotice('<p class="text-sm text-gray-500">관리자 계정만 볼 수 있는 화면이에요.</p>');
        } else if (err.code === "UNAUTHORIZED" || err.status === 401) {
          showNotice(`<p class="text-sm text-gray-500 mb-4">로그인이 만료되었어요. 다시 로그인해주세요.</p>
            <a href="../auth/login.html" class="text-sm px-4 py-2 rounded-xl text-white brand-gradient inline-block">로그인하기</a>`);
        } else {
          showNotice(`<p class="text-sm text-red-600">${esc(err.message || "대출 조건을 불러오지 못했어요. 잠시 후 다시 시도해주세요.")}</p>`);
        }
      }
    })();
  </script>
</body>
</html>
