<!DOCTYPE html>
<!-- [담당: 송귀성] 광고하기 결제 화면 (연동 대상 백엔드: domain/ad, POST /api/ads/orders로 만든 주문을 결제)
     listing-register.html / 마이페이지에서 주문을 만든 뒤 이 화면으로 온다. 주문 정보(주문번호/금액/상품명/클라이언트 키)는 sessionStorage로 받는다.
     토스 클라이언트 키 종류에 따라: 결제위젯 연동 키(test_gck_/live_gck_)면 결제위젯(결제 수단 선택 UI), 일반 API 연동 키(test_ck_/live_ck_)면 결제창을 연다.
     결제가 끝나면 토스가 ad-success.html(성공) / ad-fail.html(실패)로 돌려보낸다. -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맞집 | 광고하기 결제</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/main.css?v=20260915b" />
  <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>
  <div id="app-header"></div>

  <main class="max-w-md mx-auto px-4 py-12 space-y-5">
    <h1 class="text-2xl font-extrabold text-center">광고하기 결제</h1>

    <div id="guest-view" class="hidden card p-6 text-center">
      <p class="text-sm text-gray-500 mb-4">결제하려면 먼저 로그인해주세요.</p>
      <a href="../auth/login.html" class="text-sm px-4 py-2 rounded-full text-white brand-gradient inline-block">로그인하기</a>
    </div>

    <div id="missing-view" class="hidden card p-6 text-center">
      <p class="text-sm text-gray-500 mb-4">결제할 주문 정보를 찾을 수 없어요. 매물 등록 화면이나 등록한 매물 관리에서 다시 시작해주세요.</p>
      <div class="flex gap-2 justify-center">
        <a href="../diagnosis/listing-register.html" class="text-sm px-4 py-2 rounded-full text-white brand-gradient inline-block">매물 등록으로</a>
        <a href="../mypage/edit-condition.html#my-listings" class="text-sm px-4 py-2 rounded-full border border-gray-200 inline-block">등록한 매물 관리</a>
      </div>
    </div>

    <div id="pay-view" class="hidden space-y-4">
      <div class="card p-5 space-y-2 text-sm">
        <div class="flex justify-between items-center"><span class="text-gray-500">상품</span><span id="o-name" class="font-semibold"></span></div>
        <div class="flex justify-between items-center"><span class="text-gray-500">노출 기간</span><span id="o-period"></span></div>
        <div class="flex justify-between items-center"><span class="text-gray-500">결제 금액</span><span id="o-amount" class="font-extrabold text-lg"></span></div>
        <p id="o-target" class="text-xs text-gray-400"></p>
      </div>

      <div id="payment-method"></div>
      <div id="agreement"></div>

      <button id="pay-btn" type="button" class="w-full py-3 rounded-full text-white font-semibold brand-gradient" disabled>결제 준비 중...</button>
      <p id="pay-msg" class="text-xs text-red-500 text-center"></p>
      <p class="text-xs text-gray-400 text-center">결제가 끝나면 매물 등록(새 매물인 경우)과 광고 접수가 자동으로 진행돼요. 접수에 실패하면 결제는 자동 취소돼요.</p>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="../../js/components/header.js?v=20261008a"></script>
  <script src="../../js/components/footer.js?v=20260928c"></script>
  <script src="../../js/api/auth.js?v=20260915b"></script>
  <script src="../../js/api/ads.js?v=20261008a"></script>
  <script src="../../js/utils/toss-util.js?v=20261008a"></script>
  <script>
    renderHeader("");
    renderFooter();

    const el = (id) => document.getElementById(id);
    const show = (id) => ["guest-view", "missing-view", "pay-view"].forEach((v) => el(v).classList.toggle("hidden", v !== id));

    (async function init() {
      if (!CustomHouseAuthApi.isLoggedIn()) return show("guest-view");
      const orderId = new URLSearchParams(location.search).get("orderId");
      const order = CustomHouseAdsApi.readPendingAdOrder(orderId);
      if (!order) return show("missing-view");

      show("pay-view");
      el("o-name").textContent = order.orderName;
      el("o-period").textContent = `${order.periodDays}일`;
      el("o-amount").textContent = `${Number(order.amount).toLocaleString()}원`;
      const payBtn = el("pay-btn");
      const msg = el("pay-msg");

      const successUrl = CustomHouseAdsApi.adPageUrl("ad-success.html");
      const failUrl = CustomHouseAdsApi.adPageUrl("ad-fail.html");
      const request = { orderId: order.orderId, orderName: order.orderName, successUrl, failUrl };
      const customerKey = CustomHouseTossUtil.getOrCreateCustomerKey();
      const isWidgetKey = /^(test|live)_gck_/.test(order.clientKey || "");

      async function pay(fn) {
        msg.textContent = "";
        payBtn.disabled = true;
        try {
          await fn();   // 결제창/위젯이 열리고, 결제가 끝나면 이 페이지를 떠나 successUrl로 돌아간다
        } catch (err) {
          // 사용자가 결제창을 직접 닫은 경우는 조용히 무시
          if (!(err && err.code === "USER_CANCEL")) msg.textContent = (err && err.message) || "결제창을 여는 중 오류가 발생했습니다.";
        }
        payBtn.disabled = false;
      }

      try {
        const tossPayments = CustomHouseTossUtil.getTossPayments(order.clientKey);
        if (isWidgetKey) {
          // 결제위젯: 결제 수단 선택 + 약관 동의 UI를 이 화면에 그린다
          const widgets = tossPayments.widgets({ customerKey });
          await widgets.setAmount({ currency: "KRW", value: order.amount });
          await Promise.all([
            widgets.renderPaymentMethods({ selector: "#payment-method", variantKey: "DEFAULT" }),
            widgets.renderAgreement({ selector: "#agreement", variantKey: "AGREEMENT" }),
          ]);
          payBtn.textContent = `${Number(order.amount).toLocaleString()}원 결제하기`;
          payBtn.disabled = false;
          payBtn.addEventListener("click", () => pay(() => widgets.requestPayment(request)));
        } else {
          // 일반 API 연동 키: 토스 결제창(카드)을 바로 연다
          const payment = tossPayments.payment({ customerKey });
          payBtn.textContent = `${Number(order.amount).toLocaleString()}원 결제하기`;
          payBtn.disabled = false;
          payBtn.addEventListener("click", () =>
            pay(() => payment.requestPayment({ ...request, method: "CARD", amount: { currency: "KRW", value: order.amount } })));
        }
      } catch (err) {
        msg.textContent = (err && err.message) || "결제 화면을 준비하지 못했어요. 잠시 후 다시 시도해주세요.";
        payBtn.textContent = "결제를 진행할 수 없어요";
      }
    })();
  </script>
</body>
</html>
