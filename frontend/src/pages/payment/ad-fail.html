<!DOCTYPE html>
<!-- [담당: 송귀성] 광고하기 결제 실패/취소 콜백 페이지: 토스 결제창에서 결제가 안 됐을 때(failUrl) 돌아온다. 결제는 일어나지 않았으므로 매물도 등록되지 않는다. -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맞집 | 광고하기 결제 실패</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/main.css?v=20260915b" />
</head>
<body>
  <div id="app-header"></div>

  <main class="max-w-sm mx-auto px-4 py-24 text-center">
    <div class="text-5xl mb-4">😢</div>
    <h1 class="text-xl font-bold mb-2">결제가 완료되지 않았어요</h1>
    <p id="fail-msg" class="text-sm text-red-500 mb-2"></p>
    <p class="text-xs text-gray-400 mb-6">결제가 일어나지 않았기 때문에 비용은 청구되지 않았고, 새 매물 등록과 함께 결제하려던 경우 매물도 등록되지 않았어요. 입력한 내용은 다시 입력해야 할 수 있어요.</p>
    <div class="flex gap-2 justify-center">
      <a href="../diagnosis/listing-register.html" class="px-5 py-2 rounded-full text-white brand-gradient inline-block text-sm">매물 등록으로</a>
      <a href="../mypage/edit-condition.html#my-listings" class="px-5 py-2 rounded-full border border-gray-200 inline-block text-sm">등록한 매물 관리</a>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="../../js/components/header.js?v=20261008a"></script>
  <script src="../../js/components/footer.js?v=20260928c"></script>
  <script>
    renderHeader("");
    renderFooter();
    const params = new URLSearchParams(window.location.search);
    document.getElementById("fail-msg").textContent = params.get("message") || "결제가 취소되었거나 실패했습니다.";
  </script>
</body>
</html>
