<!DOCTYPE html>
<!-- [담당: 양혜승] 마이페이지 - 주거 조건 수정 (연동 대상 백엔드: domain/mypage, 담당 황진구) -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맞집 | 주거 조건 수정</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/main.css?v=20260915b" />
</head>
<body>
  <div id="app-header"></div>

  <main class="max-w-xl mx-auto px-4 py-12">
    <h1 class="text-2xl font-extrabold mb-6">주거 조건 수정</h1>

    <form id="condition-form" class="card p-6 space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1">월급 (만원)</label>
        <input type="number" name="monthlyIncome" required min="0" placeholder="예: 280"
               class="w-full border border-gray-200 rounded-lg px-3 py-2" />
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">직장 위치</label>
        <!-- customhouse-ai/app/data/regions.json의 work_hubs와 동일하게 유지해야 함 -->
        <select name="workLocation" required class="w-full border border-gray-200 rounded-lg px-3 py-2">
          <option value="">직장 위치를 선택하세요</option>
          <option value="강남구">강남구</option>
          <option value="종로구">종로구</option>
          <option value="영등포구">영등포구(여의도)</option>
          <option value="구로구">구로구(가산디지털단지)</option>
          <option value="성동구">성동구(성수)</option>
          <option value="분당구">분당구(판교)</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">희망 보증금 (만원)</label>
        <input type="number" name="desiredDeposit" required min="0" placeholder="예: 1000"
               class="w-full border border-gray-200 rounded-lg px-3 py-2" />
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">희망 월세 (만원, 선택)</label>
        <input type="number" name="desiredRent" min="0" placeholder="입력하지 않으면 소득 기준으로 자동 계산"
               class="w-full border border-gray-200 rounded-lg px-3 py-2" />
      </div>

      <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" name="notificationEnabled" class="w-4 h-4" />
        관심 매물 변동 알림 받기
      </label>

      <p id="form-msg" class="text-sm text-gray-400"></p>

      <button type="submit" id="submit-btn" class="w-full py-3 rounded-full text-white font-semibold brand-gradient">
        저장
      </button>
    </form>

    <p class="text-xs text-gray-400 mt-3">
      저장한 조건은 <a href="../diagnosis/input-form.html" class="underline">AI 주거비 진단</a>에서 매번 새로 입력할 필요 없이 활용할 예정입니다.
    </p>
  </main>

  <div id="app-footer"></div>

  <script src="../../js/components/header.js?v=20260915b"></script>
  <script src="../../js/components/footer.js?v=20260915b"></script>
  <script src="../../js/api/auth.js?v=20260915b"></script>
  <script src="../../js/api/mypage.js?v=20260915b"></script>
  <script>
    renderHeader("mypage");
    renderFooter();

    const form = document.getElementById("condition-form");
    const msg = document.getElementById("form-msg");
    const submitBtn = document.getElementById("submit-btn");

    if (!CustomHouseAuthApi.isLoggedIn()) {
      window.location.href = "../auth/login.html";
    }

    // 저장된 조건이 있으면 폼에 미리 채워준다.
    (async () => {
      try {
        const condition = await CustomHouseMypageApi.getMyCondition();
        if (!condition) return;
        form.monthlyIncome.value = condition.monthlyIncome ?? "";
        form.workLocation.value = condition.workLocation ?? "";
        form.desiredDeposit.value = condition.desiredDeposit ?? "";
        form.desiredRent.value = condition.desiredRent ?? "";
        form.notificationEnabled.checked = !!condition.notificationEnabled;
      } catch {
        // 조회 실패는 무시하고 빈 폼으로 진행 (저장 시 다시 에러 확인됨)
      }
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.classList.remove("text-red-500");
      msg.textContent = "저장 중...";
      submitBtn.disabled = true;

      const fd = new FormData(form);
      const condition = {
        monthlyIncome: Number(fd.get("monthlyIncome")),
        workLocation: fd.get("workLocation"),
        desiredDeposit: Number(fd.get("desiredDeposit")),
        desiredRent: fd.get("desiredRent") ? Number(fd.get("desiredRent")) : null,
        notificationEnabled: fd.get("notificationEnabled") === "on",
      };

      try {
        await CustomHouseMypageApi.updateMyCondition(condition);
        msg.textContent = "저장되었습니다!";
        setTimeout(() => (window.location.href = "index.html"), 500);
      } catch (err) {
        msg.classList.add("text-red-500");
        msg.textContent = err.message;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
